<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rogaland 3D Terrain</title>
<style>
  html,body { margin:0; height:100%; background:#0a0e16; color:#cdd; font-family:system-ui,sans-serif; overflow:hidden; }
  #hud { position:fixed; left:8px; top:8px; padding:8px 10px; background:rgba(0,0,0,.55); border-radius:6px; font-size:12px; line-height:1.4; pointer-events:none; }
  #hud b { color:#7cf; }
  #help { position:fixed; right:8px; top:8px; padding:8px 10px; background:rgba(0,0,0,.55); border-radius:6px; font-size:12px; line-height:1.4; }
  canvas { display:block; }
  label { display:block; margin-top:4px; }
</style>
</head>
<body>
<div id="hud">
  <b>Rogaland</b> · DTM 10 m terrain-RGB pyramid<br>
  drawn: <span id="tcount">0</span> · cache <span id="ccount">0</span> · fps <span id="fps">0</span>
</div>
<div id="help">
  drag = rotate · right-drag = pan · wheel = zoom<br>
  <label>exaggeration <input id="exag" type="range" min="0.5" max="3" step="0.05" value="1.4"> <span id="exagv">1.4</span></label>
  <label>SSE px <input id="sse" type="range" min="1" max="16" step="0.5" value="3"> <span id="ssev">3</span></label>
  <label>seg <input id="seg" type="range" min="16" max="128" step="16" value="64"> <span id="segv">64</span></label>
  <label><input id="showRoads" type="checkbox" checked> roads</label>
  <label><input id="showTowns" type="checkbox" checked> kommune boundaries</label>
  <label><input id="showBld" type="checkbox" checked> buildings</label>
  <label><input id="showTrees" type="checkbox" checked> forest / trees</label>
  <label>drape offset (m) <input id="drape" type="range" min="0" max="60" step="1" value="12"> <span id="drapev">12</span></label>
  <label>building visibility (km) <input id="bldRange" type="range" min="3" max="60" step="1" value="22"> <span id="bldRangev">22</span></label>
  <label>canopy range (km) <input id="canopyRange" type="range" min="3" max="50" step="1" value="30"> <span id="canopyRangev">30</span></label>
  <label>canopy LOD switch (km) <input id="canopyLod" type="range" min="0.3" max="6" step="0.1" value="1.5"> <span id="canopyLodv">1.5</span></label>
  <details id="geo-panel" style="margin-top:6px;border-top:1px solid #444;padding-top:4px;">
    <summary style="cursor:pointer;font-weight:600;">Geology</summary>
    <label><input type="checkbox" id="cb-bedrock"> Bedrock</label><br>
    <label><input type="checkbox" id="cb-quat"> Quaternary</label><br>
    <label><input type="checkbox" id="cb-faults"> Faults</label><br>
    <label>Geology blend: <input type="range" id="r-geo-blend" min="0" max="1" step="0.05" value="0.6"></label>
    <span id="r-geo-blend-val">0.60</span>
  </details>
  <details id="contour-panel" style="margin-top:6px;border-top:1px solid #444;padding-top:4px;">
    <summary style="cursor:pointer;font-weight:600;">Contours</summary>
    <label><input type="checkbox" id="cb-contours"> Show contour lines</label><br>
    <label>Interval (m):
      <select id="contour-interval">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
      </select>
    </label><br>
    <label>Opacity: <input type="range" id="r-contour-opacity" min="0" max="1" step="0.05" value="0.75"></label>
    <span id="r-contour-opacity-val">0.75</span>
  </details>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import {
  CAMERA_STORAGE_KEY,
  DEFAULT_BUILDING_RANGE_KM,
  DEFAULT_CANOPY_LOD_KM,
  DEFAULT_CANOPY_RANGE_KM,
  DEFAULT_DRAPE_OFFSET_METRES, // imported for future drape default extraction; no matching JS variable yet
  DEFAULT_EXAGGERATION,
  DEFAULT_SEGMENTS,
  DEFAULT_SSE_PX,
  ELEV_MAX as DEFAULT_ELEV_MAX,
  TREE_CANOPY_FADE_WIDTH_METRES,
} from './src/client/core/constants.js';
import { createAppState } from './src/client/core/app-state.js';
import { createWorldTransform } from './src/client/core/coordinates.js';
import { tileBounds, tileKey as terrainTileKey, tileUrl } from './src/client/terrain/tile-pyramid.js';
import {
  createBuildingMaterial,
  createTerrainMaterial,
  createWaterMaterial,
} from './src/client/rendering/material-factory.js';
import { createAmenitiesSystem } from './src/client/features/amenities.js';
import { createBuildingSystem } from './src/client/features/buildings.js';
import { createForestSystem } from './src/client/features/forest.js';
import { createWaterSystem } from './src/client/features/water.js';
import { createFaultSystem } from './src/client/overlays/faults.js';
import { createGeologySystem } from './src/client/overlays/geology.js';
import { attachIdentifyHandlers } from './src/client/overlays/identify.js';
import { createRoadSystem } from './src/client/overlays/roads.js';
import { attachControls } from './src/client/ui/controls.js';
import { updateFps, updateHud } from './src/client/ui/hud.js';

const meta = await (await fetch('tiles/meta.json')).json();
const world = createWorldTransform(meta);
const ROOT_X = world.rootX;
const ROOT_Y = world.rootY;
const ROOT_SIZE = world.rootSize;
const MAX_Z = meta.maxZ;
const SRC = meta.src;
const ELEV_MAX = meta.elevMax || DEFAULT_ELEV_MAX;
const TILE_PX = meta.tileSize;
const CENTER_X = world.centerX;
const CENTER_Y = world.centerY;

THREE.Object3D.DEFAULT_UP.set(0,0,1);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance', logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1322);
const FOG_NEAR = ROOT_SIZE*0.5, FOG_FAR = ROOT_SIZE*1.6;
const FOG_COLOR = new THREE.Color(0x0c1322);
scene.fog = new THREE.Fog(0x0c1322, FOG_NEAR, FOG_FAR);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 50, ROOT_SIZE*4);
camera.up.set(0,0,1);
camera.position.set(0, -120000, 90000);

const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = false;
controls.minDistance = 200;
controls.maxDistance = ROOT_SIZE*2;
controls.maxPolarAngle = Math.PI*0.49;
controls.zoomSpeed = 1.6;
window.__viewer = { camera, controls, renderer, scene };

// ---------- persist camera + target across reloads ----------
const CAM_STORAGE_KEY = CAMERA_STORAGE_KEY;
(function restoreCamera(){
  try {
    const raw = localStorage.getItem(CAM_STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.p) || !Array.isArray(s.t)) return;
    if (s.p.length !== 3 || s.t.length !== 3) return;
    if (!s.p.every(Number.isFinite) || !s.t.every(Number.isFinite)) return;
    camera.position.fromArray(s.p);
    controls.target.fromArray(s.t);
    camera.updateMatrixWorld();
    controls.update();
  } catch (e) { /* ignore corrupt state */ }
})();

let _camSaveTimer = 0;
function _saveCameraNow(){
  try {
    localStorage.setItem(CAM_STORAGE_KEY, JSON.stringify({
      p: camera.position.toArray(),
      t: controls.target.toArray(),
    }));
  } catch (e) { /* quota / private mode — ignore */ }
}
controls.addEventListener('change', () => {
  if (_camSaveTimer) return;
  _camSaveTimer = setTimeout(() => { _camSaveTimer = 0; _saveCameraNow(); }, 250);
});
addEventListener('beforeunload', _saveCameraNow);


// water plane (held slightly above sea-level terrain to avoid z-fighting offshore)
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOT_SIZE*1.5, ROOT_SIZE*1.5),
  new THREE.MeshBasicMaterial({ color: 0x123048 })
);
water.position.z = 1.0;
water.renderOrder = -1;
scene.add(water);

const SUN = new THREE.Vector3(-0.4, -0.6, 0.85).normalize();

// ---------- OSM overlay (roads + kommune boundaries) ----------
const overlayUniforms = {
  uExag:   { value: 1.4 },
  uOffset: { value: 12.0 },
};

const roadsGroup = new THREE.Group();   // kept for back-compat; empty in shader mode
const townsGroup = new THREE.Group();
scene.add(roadsGroup);
scene.add(townsGroup);
// ---------- Buildings (stylized Norwegian houses + apartments) ----------
const buildingsGroup = new THREE.Group();
scene.add(buildingsGroup);
const buildingUniforms = {
  uExag:      { value: 1.4 },
  uExtraLift: { value: 0.5 },
  uSun:       { value: SUN.clone() },
  uFogNear:   { value: FOG_NEAR },
  uFogFar:    { value: FOG_FAR },
  uFogColor:  { value: FOG_COLOR },
  uFadeNear:  { value: 18000 },
  uFadeFar:   { value: 22000 },
};
let BLD_RANGE = DEFAULT_BUILDING_RANGE_KM * 1000;
const buildingMaterial = createBuildingMaterial(buildingUniforms);
const buildingSystem = createBuildingSystem({
  THREE,
  scene,
  buildingsGroup,
  buildingUniforms,
  buildingMaterial,
  elevationMax: ELEV_MAX,
});
buildingSystem.load();

// ---------- Civic amenities (pitches, parks, playgrounds, props) ----------
const amenitiesGroup = new THREE.Group();
scene.add(amenitiesGroup);

const amenityAreaUniforms = {
  uExag:      { value: 1.4 },
  uExtraLift: { value: 1.2 },
  uSun:       { value: SUN.clone() },
  uFogNear:   { value: FOG_NEAR },
  uFogFar:    { value: FOG_FAR },
  uFogColor:  { value: FOG_COLOR },
  uFadeNear:  { value: 18000 },
  uFadeFar:   { value: 22000 },
};

const amenityPropUniforms = {
  uExag:     { value: 1.4 },
  uSun:      { value: SUN.clone() },
  uFogNear:  { value: FOG_NEAR },
  uFogFar:   { value: FOG_FAR },
  uFogColor: { value: FOG_COLOR },
  uFadeNear: { value: 3500 },
  uFadeFar:  { value: 5000 },
};
const amenitiesSystem = createAmenitiesSystem({
  THREE,
  scene,
  amenitiesGroup,
  amenityAreaUniforms,
  amenityPropUniforms,
});
amenitiesSystem.load();

// ---------- Forest (low-poly conifers / birches at OSM forest cover) ----------
const treesGroup = new THREE.Group();
scene.add(treesGroup);
const treeUniforms = {
  uExag:      { value: 1.4 },
  uExtraLift: { value: 0.4 },
  uSun:       { value: SUN.clone() },
  uFogNear:   { value: FOG_NEAR },
  uFogFar:    { value: FOG_FAR },
  uFogColor:  { value: FOG_COLOR },
  uFadeNear:  { value: 1200 },
  uFadeFar:   { value: 1800 },
};
let CANOPY_LOD_LO = DEFAULT_CANOPY_LOD_KM * 1000 - TREE_CANOPY_FADE_WIDTH_METRES;
let CANOPY_LOD_HI = DEFAULT_CANOPY_LOD_KM * 1000 + TREE_CANOPY_FADE_WIDTH_METRES;
let CANOPY_RANGE  = DEFAULT_CANOPY_RANGE_KM * 1000;

const canopyGroup = new THREE.Group();
scene.add(canopyGroup);
const canopyUniforms = {
  uExag:      { value: 1.4 },
  uExtraLift: { value: 0.4 },
  uSun:       { value: SUN.clone() },
  uFogNear:   { value: FOG_NEAR },
  uFogFar:    { value: FOG_FAR },
  uFogColor:  { value: FOG_COLOR },
  uFadeNear:  { value: CANOPY_LOD_LO },
  uFadeFar:   { value: CANOPY_LOD_HI },
  uRangeNear: { value: CANOPY_RANGE - 2000 },
  uRangeFar:  { value: CANOPY_RANGE },
};
const forestSystem = createForestSystem({
  THREE,
  scene,
  treesGroup,
  canopyGroup,
  treeUniforms,
  canopyUniforms,
  elevationMax: ELEV_MAX,
});
forestSystem.loadCanopy();

// ---------------- inland water bodies ----------------
const waterUniforms = {
  uExag: { value: 1.4 },
  uSun:  { value: SUN.clone() },
};
const waterMaterial = createWaterMaterial(waterUniforms);
const waterSystem = createWaterSystem({ THREE, scene, waterUniforms, waterMaterial });
waterSystem.load();
forestSystem.loadTrees();
// ---------------- end inland water -----------------


const loader = new THREE.TextureLoader();
const tileCache = new Map();
const MAX_CACHE = 400;

function tileKey(z,x,y){ return terrainTileKey(z,x,y); }
function getTile(z,x,y) {
  const k = tileKey(z,x,y);
  let t = tileCache.get(k);
  if (t) { t.lastUsed = performance.now(); return t; }
  t = { tex:null, lastUsed: performance.now(), loading:true, missing:false };
  tileCache.set(k, t);
  loader.load(tileUrl(z,x,y), tex => {
    tex.flipY = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.colorSpace = THREE.NoColorSpace;
    t.tex = tex; t.loading = false;
  }, undefined, () => { t.loading = false; t.missing = true; });
  return t;
}
function evictCache(){
  if (tileCache.size <= MAX_CACHE) return;
  const arr = [...tileCache.entries()].sort((a,b) => a[1].lastUsed - b[1].lastUsed);
  const drop = arr.slice(0, tileCache.size - MAX_CACHE);
  for (const [k, v] of drop) {
    if (v.tex) v.tex.dispose();
    tileCache.delete(k);
  }
}

// ---------- shared geometry ----------
let SEG = DEFAULT_SEGMENTS;
let plane = new THREE.PlaneGeometry(1, 1, SEG, SEG);

// ---------- shader ----------
// Shared geology overlay uniforms — all terrain materials get these
// by reference, so toggling a value affects every tile mesh at once.
const _dummyGeoTex = new THREE.DataTexture(new Uint8Array([0, 0]), 1, 1, THREE.RGFormat, THREE.UnsignedByteType);
_dummyGeoTex.needsUpdate = true;
const _dummyPalTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
_dummyPalTex.needsUpdate = true;
const geoUniforms = {
  uBedTex:      { value: _dummyGeoTex },
  uBedPalette:  { value: _dummyPalTex },
  uBedShow:     { value: 0.0 },
  uBedPalN:     { value: 1.0 },
  uQuatTex:     { value: _dummyGeoTex },
  uQuatPalette: { value: _dummyPalTex },
  uQuatShow:    { value: 0.0 },
  uQuatPalN:    { value: 1.0 },
  uGeoBBox:     { value: new THREE.Vector4(0, 0, 1, 1) },
  uGeoOpacity:  { value: 0.6 },
};

// Shared contour uniforms — same sharing pattern as geology.
const contourUniforms = {
  uContourShow:      { value: 0.0 },
  uContourInterval:  { value: 100.0 },
  uContourBoldEvery: { value: 5.0 },
  uContourColor:     { value: new THREE.Color(0x2a1a08) },  // thin: dark brown
  uContourBoldColor: { value: new THREE.Color(0x140803) },  // bold: near-black
  uContourOpacity:   { value: 0.75 },
};

// Shared road overlay uniforms. Roads are NOT drawn as separate meshes;
// instead, the terrain fragment shader looks up the nearest road segment
// for each pixel via a coarse spatial grid (built from osm.bin at load
// time) and tints the terrain colour where the pixel falls within road
// half-width of a segment. See buildRoadOverlay() below.
const _dummyRoadGrid = new THREE.DataTexture(new Float32Array([0, 0]), 1, 1, THREE.RGFormat, THREE.FloatType);
_dummyRoadGrid.minFilter = THREE.NearestFilter; _dummyRoadGrid.magFilter = THREE.NearestFilter; _dummyRoadGrid.needsUpdate = true;
const _dummyRoadRefs = new THREE.DataTexture(new Float32Array([0,0,0,0]), 1, 1, THREE.RGBAFormat, THREE.FloatType);
_dummyRoadRefs.minFilter = THREE.NearestFilter; _dummyRoadRefs.magFilter = THREE.NearestFilter; _dummyRoadRefs.needsUpdate = true;
const _dummyRoadCls = new THREE.DataTexture(new Uint8Array([0]), 1, 1, THREE.RedFormat, THREE.UnsignedByteType);
_dummyRoadCls.minFilter = THREE.NearestFilter; _dummyRoadCls.magFilter = THREE.NearestFilter; _dummyRoadCls.needsUpdate = true;
const roadUniforms = {
  uRoadGrid:      { value: _dummyRoadGrid },
  uRoadRefs:      { value: _dummyRoadRefs },
  uRoadCls:       { value: _dummyRoadCls },
  uRoadOrigin:    { value: new THREE.Vector2(0, 0) },
  uRoadCell:      { value: 500.0 },
  uRoadGridDims:  { value: new THREE.Vector2(1, 1) },
  uRoadRefsDims:  { value: new THREE.Vector2(1, 1) },
  uRoadShow:      { value: 1.0 },
  uRoadReady:     { value: 0.0 },
};

function makeMaterial(){
  return createTerrainMaterial({
      uHeight:   { value: null },
      uOriginXY: { value: new THREE.Vector2() },
      uTileSize: { value: 1 },
      uExag:     { value: 1.4 },
      uElevMax:  { value: ELEV_MAX },
      uSun:      { value: SUN.clone() },
      uSeg:      { value: SEG },
      uUVScale:  { value: new THREE.Vector2(1,1) },
      uUVOffset: { value: new THREE.Vector2(0,0) },
      uFogNear:  { value: FOG_NEAR },
      uFogFar:   { value: FOG_FAR },
      uFogColor: { value: FOG_COLOR },
      // geology overlay (shared-by-reference; updated once per uniform):
      uBedTex:      geoUniforms.uBedTex,
      uBedPalette:  geoUniforms.uBedPalette,
      uBedShow:     geoUniforms.uBedShow,
      uBedPalN:     geoUniforms.uBedPalN,
      uQuatTex:     geoUniforms.uQuatTex,
      uQuatPalette: geoUniforms.uQuatPalette,
      uQuatShow:    geoUniforms.uQuatShow,
      uQuatPalN:    geoUniforms.uQuatPalN,
      uGeoBBox:     geoUniforms.uGeoBBox,
      uGeoOpacity:  geoUniforms.uGeoOpacity,
      // contour overlay (shared-by-reference):
      uContourShow:      contourUniforms.uContourShow,
      uContourInterval:  contourUniforms.uContourInterval,
      uContourBoldEvery: contourUniforms.uContourBoldEvery,
      uContourColor:     contourUniforms.uContourColor,
      uContourBoldColor: contourUniforms.uContourBoldColor,
      uContourOpacity:   contourUniforms.uContourOpacity,
      // road overlay (shared-by-reference):
      uRoadGrid:      roadUniforms.uRoadGrid,
      uRoadRefs:      roadUniforms.uRoadRefs,
      uRoadCls:       roadUniforms.uRoadCls,
      uRoadOrigin:    roadUniforms.uRoadOrigin,
      uRoadCell:      roadUniforms.uRoadCell,
      uRoadGridDims:  roadUniforms.uRoadGridDims,
      uRoadRefsDims:  roadUniforms.uRoadRefsDims,
      uRoadShow:      roadUniforms.uRoadShow,
      uRoadReady:     roadUniforms.uRoadReady,
  });
}

// ---------- mesh pool ----------
const meshPool = [];
const meshUsed = [];
function acquireMesh(){
  let m = meshPool.pop();
  if (!m) {
    m = new THREE.Mesh(plane, makeMaterial());
    m.frustumCulled = false;
  } else {
    m.geometry = plane;
  }
  meshUsed.push(m);
  scene.add(m);
  return m;
}
function recycleMeshes(){
  for (const m of meshUsed) { scene.remove(m); meshPool.push(m); }
  meshUsed.length = 0;
}

// Update uSeg uniforms when SEG changes
function rebuildPlane(seg){
  const old = plane;
  SEG = seg;
  plane = new THREE.PlaneGeometry(1, 1, SEG, SEG);
  old.dispose();
  // existing pooled meshes will pick up SEG via uSeg uniform on next draw
}

// ---------- quadtree LOD ----------
let SSE_PX = DEFAULT_SSE_PX;
let EXAG = DEFAULT_EXAGGERATION;
const roadSystem = createRoadSystem({
  THREE,
  scene,
  roadUniforms,
  overlayUniforms,
  roadsGroup,
  townsGroup,
  src: SRC,
  centerX: CENTER_X,
  centerY: CENTER_Y,
});
roadSystem.setExaggeration(EXAG);
roadSystem.load();
// ---------------- faults layer (FLT1) -----------------
const faultsGroup = new THREE.Group();
faultsGroup.visible = false;
scene.add(faultsGroup);

// ---------------- geology raster overlay (BRR1 / QRR1) -----------------
const geologySystem = createGeologySystem({ THREE, geoUniforms, faultsGroup });
geologySystem.loadBedrock();
geologySystem.loadQuaternary();
// ---------------- end geology raster overlay -----------------

const faultSystem = createFaultSystem({ THREE, scene, faultsGroup, getExaggeration: () => EXAG });
faultSystem.load();
// ---------------- end faults layer -----------------

// ---------------- click-to-identify geology (raster lookup) -----------------
const idPanel = document.createElement('div');
idPanel.id = 'id-panel';
idPanel.style.cssText = 'position:fixed;display:none;background:rgba(0,0,0,0.78);color:#cdd;padding:8px 22px 8px 10px;border:1px solid #555;border-radius:6px;font:12px system-ui;z-index:9999;max-width:260px';
document.body.appendChild(idPanel);

const idClose = document.createElement('button');
idClose.type = 'button';
idClose.setAttribute('aria-label', 'Close');
idClose.textContent = '×';
idClose.style.cssText = 'position:absolute;top:1px;right:3px;width:14px;height:14px;padding:0;line-height:12px;font-size:14px;background:transparent;color:#aaa;border:none;cursor:pointer;font-family:system-ui';
idClose.addEventListener('mouseenter', () => { idClose.style.color = '#fff'; });
idClose.addEventListener('mouseleave', () => { idClose.style.color = '#aaa'; });
idClose.addEventListener('click', (e) => {
  e.stopPropagation();
  idPanel.style.display = 'none';
  if (_idHideTimer) { clearTimeout(_idHideTimer); _idHideTimer = null; }
});
idPanel.appendChild(idClose);

const idContent = document.createElement('div');
idPanel.appendChild(idContent);

let _idHideTimer = null;
function showIdPanel(x, y, info) {
  if (!info.bedrock && !info.quat) { idPanel.style.display = 'none'; return; }
  const swatch = (hex) => `<span style="display:inline-block;width:10px;height:10px;background:${hex};border:1px solid #888;margin-right:4px;vertical-align:middle"></span>`;
  let html = '';
  if (info.bedrock) html += `<div>${swatch(info.bedrock.color)}<b>Bedrock:</b> ${info.bedrock.name} <span style="opacity:0.6">(${info.bedrock.scale})</span></div>`;
  if (info.quat)    html += `<div>${swatch(info.quat.color)}<b>Quaternary:</b> ${info.quat.name} <span style="opacity:0.6">(${info.quat.scale})</span></div>`;
  idContent.innerHTML = html;
  idPanel.style.left = `${x + 12}px`;
  idPanel.style.top  = `${y + 12}px`;
  idPanel.style.display = 'block';
  if (_idHideTimer) clearTimeout(_idHideTimer);
  _idHideTimer = setTimeout(() => { idPanel.style.display = 'none'; }, 8000);
}

attachIdentifyHandlers({
  canvas: renderer.domElement,
  camera,
  scene,
  geologySystem,
  showPanel: showIdPanel,
});
// ---------------- end click-to-identify -----------------

function tileBoundsWorld(z,x,y){
  const b = tileBounds(meta, z, x, y);
  return { xmin: b.x0 - CENTER_X, ymin: b.y0 - CENTER_Y, xmax: b.x1 - CENTER_X, ymax: b.y1 - CENTER_Y, size: b.size };
}
function tileIntersectsSrc(z,x,y){
  const b = tileBounds(meta, z, x, y);
  return !(b.x1 <= SRC.xMin || b.x0 >= SRC.xMax || b.y1 <= SRC.yMin || b.y0 >= SRC.yMax);
}

const _v = new THREE.Vector3();
function projectedSizePx(b){
  const cx = (b.xmin + b.xmax)/2;
  const cy = (b.ymin + b.ymax)/2;
  _v.set(cx, cy, 0);
  const dist = Math.max(camera.position.distanceTo(_v), 1);
  const halfH = Math.tan(camera.fov*Math.PI/360) * dist;
  return (b.size / (2*halfH)) * renderer.domElement.height;
}

const frustum = new THREE.Frustum();
const _box = new THREE.Box3();
const _projMat = new THREE.Matrix4();
const _bmin = new THREE.Vector3();
const _bmax = new THREE.Vector3();
function inFrustum(b){
  _bmin.set(b.xmin, b.ymin, 0);
  _bmax.set(b.xmax, b.ymax, ELEV_MAX*EXAG + 50);
  _box.set(_bmin, _bmax);
  return frustum.intersectsBox(_box);
}

let drawn = 0;
function visit(z,x,y){
  if (!tileIntersectsSrc(z,x,y)) return;
  const b = tileBoundsWorld(z,x,y);
  if (!inFrustum(b)) return;
  const screenPx = projectedSizePx(b);
  const sse = screenPx / SEG;
  if (z < MAX_Z && sse > SSE_PX) {
    visit(z+1, x*2,   y*2);
    visit(z+1, x*2+1, y*2);
    visit(z+1, x*2,   y*2+1);
    visit(z+1, x*2+1, y*2+1);
    return;
  }
  let tz=z, tx=x, ty=y;
  let t = getTile(tz,tx,ty);
  while ((!t.tex || t.missing) && tz > 0) {
    tz--; tx >>= 1; ty >>= 1;
    t = getTile(tz,tx,ty);
  }
  if (!t.tex) return;
  drawTile(z,x,y, b, tz,tx,ty, t.tex);
}

function drawTile(z,x,y, b, tz,tx,ty, tex){
  const m = acquireMesh();
  m.position.set((b.xmin+b.xmax)/2, (b.ymin+b.ymax)/2, 0);
  m.scale.set(b.size, b.size, 1);
  const u = m.material.uniforms;
  u.uHeight.value = tex;
  u.uOriginXY.value.set(b.xmin, b.ymin);
  u.uTileSize.value = b.size;
  u.uExag.value = EXAG;
  u.uElevMax.value = ELEV_MAX;
  u.uSun.value.copy(SUN);
  u.uSeg.value = SEG;
  u.uFogNear.value = FOG_NEAR;
  u.uFogFar.value = FOG_FAR;
  u.uFogColor.value = FOG_COLOR;
  if (tz === z) {
    u.uUVScale.value.set(1,1);
    u.uUVOffset.value.set(0,0);
  } else {
    const dz = z - tz;
    const span = 1.0 / (1 << dz);
    const ax = x - (tx << dz);
    const ay = y - (ty << dz);
    u.uUVScale.value.set(span, span);
    u.uUVOffset.value.set(ax*span, ay*span);
  }
  drawn++;
}

// ---------- compass overlay (bottom-left) ----------
const compassScene = new THREE.Scene();
const compassCam = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
compassCam.up.set(0,0,1);
compassScene.add(new THREE.AmbientLight(0xffffff, 0.55));
const _compassLight = new THREE.DirectionalLight(0xffffff, 0.9);
_compassLight.position.set(2, 3, 4);
compassScene.add(_compassLight);

const compassArrow = new THREE.Group();

// Flat extruded arrow shape in the XY plane (points +Y = north).
const _arrowShape = new THREE.Shape();
_arrowShape.moveTo(-0.12, -0.9);
_arrowShape.lineTo( 0.12, -0.9);
_arrowShape.lineTo( 0.12,  0.4);
_arrowShape.lineTo( 0.36,  0.4);
_arrowShape.lineTo( 0.00,  1.05);
_arrowShape.lineTo(-0.36,  0.4);
_arrowShape.lineTo(-0.12,  0.4);
_arrowShape.lineTo(-0.12, -0.9);
const _arrowGeom = new THREE.ExtrudeGeometry(_arrowShape, {
  depth: 0.10,
  bevelEnabled: true,
  bevelThickness: 0.02,
  bevelSize: 0.015,
  bevelSegments: 2,
  curveSegments: 1,
});
// Toon-style: each face a uniform colour band with a clean step gradient.
const _toonGradient = (() => {
  const d = new Uint8Array([90,90,90,255, 200,200,200,255, 255,255,255,255]);
  const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
  t.needsUpdate = true;
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
})();
const _arrowMat = new THREE.MeshToonMaterial({
  color: 0xffd21a,
  gradientMap: _toonGradient,
});
_arrowMat.flatShading = true;
_arrowMat.polygonOffset = true;
_arrowMat.polygonOffsetFactor = 1;
_arrowMat.polygonOffsetUnits = 1;
const _arrowMesh = new THREE.Mesh(_arrowGeom, _arrowMat);
compassArrow.add(_arrowMesh);

// Thin black outline along sharp edges.
const _arrowEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(_arrowGeom, 18),
  new THREE.LineBasicMaterial({ color: 0x000000 })
);
compassArrow.add(_arrowEdges);

// "N" label as a sprite at the tip, in the same depth space (so the arrow can occlude it).
const _nCanvas = document.createElement('canvas');
_nCanvas.width = 96; _nCanvas.height = 96;
{
  const c = _nCanvas.getContext('2d');
  c.clearRect(0, 0, 96, 96);
  c.fillStyle = '#ffffff';
  c.strokeStyle = '#000000';
  c.lineWidth = 6;
  c.font = 'bold 72px sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.strokeText('N', 48, 52);
  c.fillText('N', 48, 52);
}
const _nTex = new THREE.CanvasTexture(_nCanvas);
_nTex.colorSpace = THREE.SRGBColorSpace;
_nTex.anisotropy = 4;
const _nSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: _nTex, depthTest: true, depthWrite: false, transparent: true,
}));
_nSprite.scale.set(0.34, 0.34, 1);
// Sit the label at the tip, centred in the arrow's thickness so the arrow body can occlude it.
_nSprite.position.set(0, 1.32, 0.05);
compassArrow.add(_nSprite);

compassScene.add(compassArrow);

const COMPASS_SIZE_PX = 140;
const COMPASS_PAD_PX = 16;
const COMPASS_DIST = 3.4;
const _compassFwd = new THREE.Vector3();

function renderCompass() {
  // Mirror main camera orientation around the arrow's origin so visual north matches.
  _compassFwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  compassCam.position.copy(_compassFwd).multiplyScalar(-COMPASS_DIST);
  compassCam.quaternion.copy(camera.quaternion);
  compassCam.updateMatrixWorld();

  const s = COMPASS_SIZE_PX;
  const x = COMPASS_PAD_PX;
  const y = COMPASS_PAD_PX; // GL origin is bottom-left, so this places it at bottom-left
  const prevAutoClear = renderer.autoClear;
  renderer.autoClear = false;
  renderer.setScissorTest(true);
  renderer.setViewport(x, y, s, s);
  renderer.setScissor(x, y, s, s);
  renderer.clearDepth();
  renderer.render(compassScene, compassCam);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.autoClear = prevAutoClear;
}

// ---------- main loop ----------
let last = performance.now(), frames=0;
function loop(){
  requestAnimationFrame(loop);
  controls.update();
  recycleMeshes();
  drawn = 0;

  camera.updateMatrixWorld();
  _projMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(_projMat);

  visit(0,0,0);
  buildingSystem.cull({ camera, frustum, rangeMetres: BLD_RANGE });
  forestSystem.cull({ camera, frustum });
  evictCache();
  renderer.render(scene, camera);
  renderCompass();

  frames++;
  const now = performance.now();
  if (now - last > 500) {
    updateFps(frames * 1000 / (now-last));
    frames = 0; last = now;
    updateHud({ drawn, cacheSize: tileCache.size });
  }
}

const appState = createAppState({
  exag: EXAG,
  ssePx: SSE_PX,
  seg: SEG,
  buildingRange: BLD_RANGE,
  canopyRange: CANOPY_RANGE,
  canopyLodLo: CANOPY_LOD_LO,
  canopyLodHi: CANOPY_LOD_HI,
});

attachControls({
  appState,
  systems: {
    roads: roadSystem,
    buildings: buildingSystem,
    amenities: amenitiesSystem,
    forest: forestSystem,
    water: waterSystem,
    geology: geologySystem,
    faults: faultSystem,
  },
  uniforms: {
    overlayUniforms,
    buildingUniforms,
    treeUniforms,
    canopyUniforms,
    waterUniforms,
    amenityAreaUniforms,
    amenityPropUniforms,
    geoUniforms,
    contourUniforms,
  },
  rebuildPlane,
  stateAccessors: {
    setExag(value) { EXAG = value; },
    setSsePx(value) { SSE_PX = value; },
    setBuildingRange(value) { BLD_RANGE = value; },
    setCanopyRange(value) { CANOPY_RANGE = value; },
    setCanopyLod(lo, hi) { CANOPY_LOD_LO = lo; CANOPY_LOD_HI = hi; },
    getSegments() { return SEG; },
  },
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
