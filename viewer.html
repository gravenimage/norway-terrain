<body>

        <option value="500">500</option>
      </select>
    </label><br>

    <span id="r-contour-opacity-val">0.75</span>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import {
  amenityGeometryBuilders,
  makeHouseGeometry,
  makeTreeBillboardGeometry,
  makeTreeGeometry,
} from './src/client/features/geometry-builders.js';
import {
  CAMERA_STORAGE_KEY,
  DEFAULT_BUILDING_RANGE_KM,
  DEFAULT_CANOPY_LOD_KM,
  DEFAULT_CANOPY_RANGE_KM,
  DEFAULT_DRAPE_OFFSET_METRES, // imported for future drape default extraction; no matching JS variable yet
  DEFAULT_EXAGGERATION,
  DEFAULT_SEGMENTS,
  DEFAULT_SSE_PX,
  ELEV_MAX as DEFAULT_ELEV_MAX,
  TREE_CANOPY_FADE_WIDTH_METRES,
} from './src/client/core/constants.js';
import { createWorldTransform } from './src/client/core/coordinates.js';
import { tileBounds, tileKey as terrainTileKey, tileUrl } from './src/client/terrain/tile-pyramid.js';

const {
  buildBenchGeom,
  buildPicnicTableGeom,
  buildLighthouseGeom,
} = amenityGeometryBuilders;

const meta = await (await fetch('tiles/meta.json')).json();
const world = createWorldTransform(meta);
const ROOT_X = world.rootX;
const ROOT_Y = world.rootY;
const ROOT_SIZE = world.rootSize;
const MAX_Z = meta.maxZ;
const SRC = meta.src;
const ELEV_MAX = meta.elevMax || DEFAULT_ELEV_MAX;
const TILE_PX = meta.tileSize;
const CENTER_X = world.centerX;
const CENTER_Y = world.centerY;

THREE.Object3D.DEFAULT_UP.set(0,0,1);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance', logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1322);
const FOG_NEAR = ROOT_SIZE*0.5, FOG_FAR = ROOT_SIZE*1.6;
const FOG_COLOR = new THREE.Color(0x0c1322);
scene.fog = new THREE.Fog(0x0c1322, FOG_NEAR, FOG_FAR);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 50, ROOT_SIZE*4);
camera.up.set(0,0,1);
camera.position.set(0, -120000, 90000);

const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = false;
controls.minDistance = 200;
controls.maxDistance = ROOT_SIZE*2;
controls.maxPolarAngle = Math.PI*0.49;
controls.zoomSpeed = 1.6;
window.__viewer = { camera, controls, renderer, scene };

// ---------- persist camera + target across reloads ----------
const CAM_STORAGE_KEY = CAMERA_STORAGE_KEY;
(function restoreCamera(){
  try {
    const raw = localStorage.getItem(CAM_STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.p) || !Array.isArray(s.t)) return;
    if (s.p.length !== 3 || s.t.length !== 3) return;
    if (!s.p.every(Number.isFinite) || !s.t.every(Number.isFinite)) return;
    camera.position.fromArray(s.p);
    controls.target.fromArray(s.t);
    camera.updateMatrixWorld();
    controls.update();
  } catch (e) { /* ignore corrupt state */ }
})();

let _camSaveTimer = 0;
function _saveCameraNow(){
  try {
    localStorage.setItem(CAM_STORAGE_KEY, JSON.stringify({
      p: camera.position.toArray(),
      t: controls.target.toArray(),
    }));
  } catch (e) { /* quota / private mode — ignore */ }
}
controls.addEventListener('change', () => {
  if (_camSaveTimer) return;
  _camSaveTimer = setTimeout(() => { _camSaveTimer = 0; _saveCameraNow(); }, 250);
});
addEventListener('beforeunload', _saveCameraNow);


// water plane (held slightly above sea-level terrain to avoid z-fighting offshore)
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOT_SIZE*1.5, ROOT_SIZE*1.5),
  new THREE.MeshBasicMaterial({ color: 0x123048 })
);
water.position.z = 1.0;
water.renderOrder = -1;
scene.add(water);

const SUN = new THREE.Vector3(-0.4, -0.6, 0.85).normalize();

// ---------- OSM overlay (roads + kommune boundaries) ----------
const overlayUniforms = {
  uExag:   { value: 1.4 },
  uOffset: { value: 12.0 },
};
const overlayVert = /* glsl */`
#include <common>
#include <logdepthbuf_pars_vertex>
uniform float uExag;
uniform float uOffset;
void main(){
  vec3 p = position;
  p.z = max(p.z, 0.0) * uExag + uOffset;
  gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
  #include <logdepthbuf_vertex>
}
`;
const overlayFrag = /* glsl */`
precision highp float;
#include <common>
#include <logdepthbuf_pars_fragment>
uniform vec3 uColor;
void main(){
  #include <logdepthbuf_fragment>
  gl_FragColor = vec4(uColor, 1.0);
}
`;
function makeLineMaterial(color){
  return new THREE.ShaderMaterial({
    uniforms: { ...overlayUniforms, uColor: { value: new THREE.Color(color) } },
    vertexShader: overlayVert,
    fragmentShader: overlayFrag,
    transparent: false,
    depthTest: true,
    depthWrite: false,
  });
}

const ROAD_COLORS_ARR = [
  '#ff5050', // motorway (unused: roads are now shader-rendered)
  '#ff8a3c', // trunk
  '#ffc846', // primary
  '#ffe89a', // secondary
  '#cfd8dc', // tertiary
];
const TOWN_COLOR = '#7be0c8';

const roadsGroup = new THREE.Group();   // kept for back-compat; empty in shader mode
const townsGroup = new THREE.Group();
scene.add(roadsGroup);
scene.add(townsGroup);

// Realistic per-class road halfwidths (metres). Must match the values
// hard-coded in the terrain fragment shader.
const ROAD_HALF_W = [6.5, 5.0, 4.0, 3.25, 2.75];

// Builds the spatial grid + data textures consumed by the terrain shader's
// road overlay. segsByClass: Array(5) of Float32Array, packed (x0,y0,x1,y1,...).
function buildRoadOverlay(segsByClass){
  const xMinC = SRC.xMin - CENTER_X;
  const yMinC = SRC.yMin - CENTER_Y;
  const W = SRC.xMax - SRC.xMin;
  const H = SRC.yMax - SRC.yMin;
  const cell = 100.0;
  const gridW = Math.ceil(W / cell);
  const gridH = Math.ceil(H / cell);

  let N = 0;
  for (let cls = 0; cls < 5; cls++) N += (segsByClass[cls].length / 4) | 0;

  // ax, ay, bx, by, cls per segment
  const segAx = new Float32Array(N);
  const segAy = new Float32Array(N);
  const segBx = new Float32Array(N);
  const segBy = new Float32Array(N);
  const segCls = new Uint8Array(N);
  {
    let i = 0;
    for (let cls = 0; cls < 5; cls++) {
      const arr = segsByClass[cls];
      const m = (arr.length / 4) | 0;
      for (let k = 0; k < m; k++) {
        segAx[i] = arr[k*4 + 0];
        segAy[i] = arr[k*4 + 1];
        segBx[i] = arr[k*4 + 2];
        segBy[i] = arr[k*4 + 3];
        segCls[i] = cls;
        i++;
      }
    }
  }

  // Bucket segments into cells whose expanded AABB they touch.
  const cellCount = gridW * gridH;
  const cells = new Array(cellCount);
  for (let i = 0; i < cellCount; i++) cells[i] = [];
  let maxCellCount = 0;
  for (let i = 0; i < N; i++) {
    const cls = segCls[i];
    const hw = ROAD_HALF_W[cls];
    const minX = Math.min(segAx[i], segBx[i]) - hw;
    const maxX = Math.max(segAx[i], segBx[i]) + hw;
    const minY = Math.min(segAy[i], segBy[i]) - hw;
    const maxY = Math.max(segAy[i], segBy[i]) + hw;
    let cx0 = Math.floor((minX - xMinC) / cell);
    let cx1 = Math.floor((maxX - xMinC) / cell);
    let cy0 = Math.floor((minY - yMinC) / cell);
    let cy1 = Math.floor((maxY - yMinC) / cell);
    if (cx1 < 0 || cy1 < 0 || cx0 >= gridW || cy0 >= gridH) continue;
    if (cx0 < 0) cx0 = 0; if (cx1 >= gridW) cx1 = gridW - 1;
    if (cy0 < 0) cy0 = 0; if (cy1 >= gridH) cy1 = gridH - 1;
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        cells[cy * gridW + cx].push(i);
      }
    }
  }

  let totalRefs = 0;
  for (let c = 0; c < cellCount; c++) {
    const n = cells[c].length;
    if (n > maxCellCount) maxCellCount = n;
    totalRefs += n;
  }

  // Pack refs into a 2-D texture (RGBA = ax, ay, bx, by) + parallel R8 class texture.
  const refsTexW = 2048;
  const refsTexH = Math.max(1, Math.ceil(totalRefs / refsTexW));
  const refsData = new Float32Array(refsTexW * refsTexH * 4);
  const clsData  = new Uint8Array(refsTexW * refsTexH);
  const gridData = new Float32Array(gridW * gridH * 2);

  let p = 0;
  for (let c = 0; c < cellCount; c++) {
    const list = cells[c];
    gridData[c * 2 + 0] = p;
    gridData[c * 2 + 1] = list.length;
    // Cap per-cell list at 128 (shader loop bound). Sort by class so we keep
    // the largest roads when overflow happens.
    let lim = list.length;
    if (lim > 128) {
      list.sort((a, b) => segCls[a] - segCls[b]);
      lim = 128;
      gridData[c * 2 + 1] = 128;
    }
    for (let kk = 0; kk < lim; kk++) {
      const idx = list[kk];
      refsData[p * 4 + 0] = segAx[idx];
      refsData[p * 4 + 1] = segAy[idx];
      refsData[p * 4 + 2] = segBx[idx];
      refsData[p * 4 + 3] = segBy[idx];
      clsData[p] = segCls[idx];
      p++;
    }
  }

  const gridTex = new THREE.DataTexture(gridData, gridW, gridH, THREE.RGFormat, THREE.FloatType);
  gridTex.minFilter = THREE.NearestFilter; gridTex.magFilter = THREE.NearestFilter;
  gridTex.wrapS = THREE.ClampToEdgeWrapping; gridTex.wrapT = THREE.ClampToEdgeWrapping;
  gridTex.needsUpdate = true;

  const refsTex = new THREE.DataTexture(refsData, refsTexW, refsTexH, THREE.RGBAFormat, THREE.FloatType);
  refsTex.minFilter = THREE.NearestFilter; refsTex.magFilter = THREE.NearestFilter;
  refsTex.wrapS = THREE.ClampToEdgeWrapping; refsTex.wrapT = THREE.ClampToEdgeWrapping;
  refsTex.needsUpdate = true;

  const clsTex = new THREE.DataTexture(clsData, refsTexW, refsTexH, THREE.RedFormat, THREE.UnsignedByteType);
  clsTex.minFilter = THREE.NearestFilter; clsTex.magFilter = THREE.NearestFilter;
  clsTex.wrapS = THREE.ClampToEdgeWrapping; clsTex.wrapT = THREE.ClampToEdgeWrapping;
  clsTex.needsUpdate = true;

  roadUniforms.uRoadGrid.value = gridTex;
  roadUniforms.uRoadRefs.value = refsTex;
  roadUniforms.uRoadCls.value  = clsTex;
  roadUniforms.uRoadOrigin.value.set(xMinC, yMinC);
  roadUniforms.uRoadCell.value = cell;
  roadUniforms.uRoadGridDims.value.set(gridW, gridH);
  roadUniforms.uRoadRefsDims.value.set(refsTexW, refsTexH);
  roadUniforms.uRoadReady.value = 1.0;

  // Expose for the B-key HUD
  window.__roadGrid = { gridW, gridH, gridData, maxCellCount, totalRefs, N, cell, xMinC, yMinC };

  console.log(`roads: ${N.toLocaleString()} segs · grid ${gridW}×${gridH} @ ${cell}m · ${totalRefs.toLocaleString()} refs · max ${maxCellCount} segs/cell · refs tex ${refsTexW}×${refsTexH}`);
  if (maxCellCount > 128) console.warn(`road grid: ${maxCellCount} > 128 segs in some cell — overflow truncated`);
}

(async () => {
  try {
    const ab = await (await fetch('osm.bin')).arrayBuffer();
    const dv = new DataView(ab);
    const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
    if (magic !== 'OSM2') throw new Error('bad magic ' + magic);
    let off = 4;
    const nGroups = dv.getUint32(off, true); off += 4;
    /* centerX */ dv.getFloat64(off, true); off += 8;
    /* centerY */ dv.getFloat64(off, true); off += 8;
    let totalSegs = 0, townSegs = 0;
    // Collect per-class segments (x0,y0,x1,y1 quads) for the shader overlay.
    const segsByClass = [[], [], [], [], []];
    for (let g = 0; g < nGroups; g++) {
      const cls = dv.getUint8(off); off += 4; // 1 byte cls + 3 pad
      const n = dv.getUint32(off, true); off += 4;
      // n is even (LineSegments pair vertices)
      const verts = new Float32Array(ab, off, n * 3);
      off += n * 3 * 4;
      if (cls === 5) {
        // Kommune boundaries: still drawn as actual line segments.
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        const mat = makeLineMaterial(TOWN_COLOR);
        const ls = new THREE.LineSegments(geom, mat);
        ls.frustumCulled = false;
        ls.renderOrder = 11;
        townsGroup.add(ls);
        townSegs += n / 2;
      } else if (cls >= 0 && cls <= 4) {
        // Roads: extract (x0,y0,x1,y1) pairs for the shader spatial index.
        const m = (n / 2) | 0;
        const out = new Float32Array(m * 4);
        for (let k = 0; k < m; k++) {
          out[k*4 + 0] = verts[k*6 + 0];
          out[k*4 + 1] = verts[k*6 + 1];
          out[k*4 + 2] = verts[k*6 + 3];
          out[k*4 + 3] = verts[k*6 + 4];
        }
        segsByClass[cls] = segsByClass[cls].length
          ? Float32Concat(segsByClass[cls], out) : out;
        totalSegs += m;
      }
    }
    buildRoadOverlay(segsByClass);
    overlayUniforms.uExag.value = EXAG;
    document.getElementById('hud').insertAdjacentHTML('beforeend',
      `<br>roads: ${totalSegs.toLocaleString()} segs · kommune: ${townSegs.toLocaleString()} segs`);
  } catch (e) {
    console.warn('osm.bin not loaded:', e);
  }
})();

function Float32Concat(a, b) {
  const out = new Float32Array(a.length + b.length);
  out.set(a, 0); out.set(b, a.length);
  return out;
}

// ---------- Buildings (stylized Norwegian houses + apartments) ----------
// 12-colour palette: 0..4 house wood, 5..7 apartments, 8..10 commercial, 11 cabin brown
const PAL = [
  [0.61,0.16,0.15], // 0 falu red
  [0.93,0.90,0.83], // 1 white
  [0.79,0.63,0.31], // 2 ochre
  [0.83,0.63,0.09], // 3 mustard
  [0.42,0.12,0.09], // 4 dark red
  [0.71,0.69,0.66], // 5 apt grey
  [0.81,0.77,0.68], // 6 apt beige
  [0.85,0.78,0.65], // 7 apt cream
  [0.61,0.59,0.56], // 8 commercial concrete
  [0.76,0.74,0.70], // 9 commercial light
  [0.48,0.47,0.44], //10 commercial grey
  [0.44,0.31,0.17], //11 cabin brown
];
function roofFor(typeIdx, colorIdx){
  if (typeIdx === 0 || typeIdx === 3) return [0.16,0.16,0.18]; // dark slate
  if (typeIdx === 1) return [0.32,0.30,0.28];
  return [0.45,0.45,0.43];
}

// unit "house" geometry: footprint [-0.5,0.5]² (XY), wall z 0..1, roof z 1..2 (peak).
// Vertices duplicated per face so each face gets its own flat normal.

const buildingVert = /* glsl */`
#include <common>
#include <logdepthbuf_pars_vertex>
attribute float aPart;
attribute vec3 iPos;
attribute vec3 iSize;
attribute float iRot;
attribute vec3 iWallColor;
attribute vec3 iRoofColor;
attribute float iRoofH;
uniform float uExag;
uniform float uExtraLift;
varying vec3 vColor;
varying vec3 vWorld;
varying vec3 vNormal;
void main(){
  vec3 p = position;
  p.x *= iSize.x;
  p.y *= iSize.y;
  if (aPart < 0.5) {
    p.z = p.z * iSize.z;
  } else {
    p.z = iSize.z + (p.z - 1.0) * iRoofH;
  }
  float c = cos(iRot), s = sin(iRot);
  vec2 r = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
  p.x = r.x; p.y = r.y;
  p.x += iPos.x;
  p.y += iPos.y;
  p.z += iPos.z * uExag + uExtraLift;
  vec3 N = normal;
  vec2 nr = vec2(c*N.x - s*N.y, s*N.x + c*N.y);
  N = normalize(vec3(nr, N.z));
  vNormal = N;
  vColor  = (aPart < 0.5) ? iWallColor : iRoofColor;
  vWorld  = p;
  gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
  #include <logdepthbuf_vertex>
}`;
const buildingFrag = /* glsl */`
precision highp float;
#include <common>
#include <logdepthbuf_pars_fragment>
varying vec3 vNormal;
varying vec3 vColor;
varying vec3 vWorld;
uniform vec3 uSun;
uniform vec3 uFogColor;
uniform float uFogNear;
uniform float uFogFar;
uniform float uFadeNear;
uniform float uFadeFar;
void main(){
  #include <logdepthbuf_fragment>
  vec3 N = normalize(vNormal);
  float diff = clamp(dot(N, normalize(uSun)), 0.0, 1.0);
  float wrap = 0.30 + 0.85 * diff;
  float zBias = clamp(N.z * 0.15 + 0.85, 0.6, 1.0);
  vec3 col = vColor * wrap * zBias;
  float dist = length(vWorld - cameraPosition);
  float fogF = smoothstep(uFogNear, uFogFar, dist);
  col = mix(col, uFogColor, fogF);
  float alpha = 1.0 - smoothstep(uFadeNear, uFadeFar, dist);
  if (alpha < 0.01) discard;
  gl_FragColor = vec4(col, alpha);
}`;

const buildingsGroup = new THREE.Group();
scene.add(buildingsGroup);
const buildingUniforms = {
  uExag:      { value: 1.4 },
  uExtraLift: { value: 0.5 },
  uSun:       { value: SUN.clone() },
  uFogNear:   { value: FOG_NEAR },
  uFogFar:    { value: FOG_FAR },
  uFogColor:  { value: FOG_COLOR },
  uFadeNear:  { value: 18000 },
  uFadeFar:   { value: 22000 },
};
let BLD_RANGE = DEFAULT_BUILDING_RANGE_KM * 1000;
const buildingMaterial = new THREE.ShaderMaterial({
  uniforms: buildingUniforms,
  vertexShader: buildingVert,
  fragmentShader: buildingFrag,
  transparent: true,
  depthWrite: true,
});

const buildingCells = []; // { mesh, cx, cy, radius }

(async () => {
  try {
    const ab = await (await fetch('buildings.bin')).arrayBuffer();
    const dv = new DataView(ab);
    const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
    if (magic !== 'BLD1') throw new Error('bad magic ' + magic);
    const n = dv.getUint32(4, true);
    const REC = 32; // 7 floats + 4 bytes
    const dataOff = 8;
    // First pass: scan into typed arrays + bin into 8 km cells
    const CELL = 8000;
    const bins = new Map();
    const tmp = new DataView(ab, dataOff);
    for (let i = 0; i < n; i++){
      const o = i * REC;
      const cx = tmp.getFloat32(o + 0, true);
      const cy = tmp.getFloat32(o + 4, true);
      const gx = Math.floor(cx / CELL);
      const gy = Math.floor(cy / CELL);
      const k = gx * 100000 + gy;
      let arr = bins.get(k);
      if (!arr) { arr = []; bins.set(k, arr); }
      arr.push(i);
    }
    const houseGeom = makeHouseGeometry();
    let totalCells = 0;
    for (const [, idxArr] of bins){
      const m = idxArr.length;
      if (!m) continue;
      const iPos = new Float32Array(m * 3);
      const iSize = new Float32Array(m * 3);
      const iRot = new Float32Array(m);
      const iWallColor = new Float32Array(m * 3);
      const iRoofColor = new Float32Array(m * 3);
      const iRoofH = new Float32Array(m);
      let bxMin = Infinity, byMin = Infinity, bxMax = -Infinity, byMax = -Infinity;
      for (let k = 0; k < m; k++){
        const o = idxArr[k] * REC;
        const cx = tmp.getFloat32(o + 0, true);
        const cy = tmp.getFloat32(o + 4, true);
        const bz = tmp.getFloat32(o + 8, true);
        const L  = tmp.getFloat32(o + 12, true);
        const W  = tmp.getFloat32(o + 16, true);
        const H  = tmp.getFloat32(o + 20, true);
        const a  = tmp.getFloat32(o + 24, true);
        const t  = tmp.getUint8(o + 28);
        const rf = tmp.getUint8(o + 29);
        const ci = tmp.getUint8(o + 30);
        iPos[k*3+0] = cx; iPos[k*3+1] = cy; iPos[k*3+2] = bz;
        iSize[k*3+0] = L; iSize[k*3+1] = W; iSize[k*3+2] = H;
        iRot[k] = a;
        const wc = PAL[ci] || PAL[1];
        iWallColor[k*3+0] = wc[0]; iWallColor[k*3+1] = wc[1]; iWallColor[k*3+2] = wc[2];
        const rc = roofFor(t, ci);
        iRoofColor[k*3+0] = rc[0]; iRoofColor[k*3+1] = rc[1]; iRoofColor[k*3+2] = rc[2];
        // roof height: 0 flat, gabled = min(0.55 * width, 4.5)
        let rh = 0;
        if (rf === 1) rh = Math.min(0.55 * W, 4.5);
        else if (rf === 2) rh = Math.min(0.40 * W, 3.5);
        iRoofH[k] = rh;
        if (cx < bxMin) bxMin = cx; if (cy < byMin) byMin = cy;
        if (cx > bxMax) bxMax = cx; if (cy > byMax) byMax = cy;
      }
      const cellCx = (bxMin + bxMax) / 2, cellCy = (byMin + byMax) / 2;
      const radius = Math.hypot(bxMax - cellCx, byMax - cellCy) + 60; // include eaves
      const ig = new THREE.InstancedBufferGeometry();
      ig.setAttribute('position', houseGeom.getAttribute('position'));
      ig.setAttribute('normal',   houseGeom.getAttribute('normal'));
      ig.setAttribute('aPart',    houseGeom.getAttribute('aPart'));
      ig.setAttribute('iPos',       new THREE.InstancedBufferAttribute(iPos, 3));
      ig.setAttribute('iSize',      new THREE.InstancedBufferAttribute(iSize, 3));
      ig.setAttribute('iRot',       new THREE.InstancedBufferAttribute(iRot, 1));
      ig.setAttribute('iWallColor', new THREE.InstancedBufferAttribute(iWallColor, 3));
      ig.setAttribute('iRoofColor', new THREE.InstancedBufferAttribute(iRoofColor, 3));
      ig.setAttribute('iRoofH',     new THREE.InstancedBufferAttribute(iRoofH, 1));
      ig.instanceCount = m;
      const mesh = new THREE.Mesh(ig, buildingMaterial);
      mesh.frustumCulled = false; // we cull cells manually
      buildingsGroup.add(mesh);
      buildingCells.push({ mesh, cx: cellCx, cy: cellCy, radius });
      totalCells++;
    }
    document.getElementById('hud').insertAdjacentHTML('beforeend',
      `<br>buildings: ${n.toLocaleString()} in ${totalCells} cells`);
  } catch (e) {
    console.warn('buildings.bin not loaded:', e);
  }
})();

const amenityAreaUniforms = {
  uExag:      { value: 1.4 },
  uExtraLift: { value: 1.2 },
  uSun:       { value: SUN.clone() },
  uFogNear:   { value: FOG_NEAR },
  uFogFar:    { value: FOG_FAR },
  uFogColor:  { value: FOG_COLOR },
  uFadeNear:  { value: 18000 },
  uFadeFar:   { value: 22000 },
};
const amenityAreaMaterial = new THREE.ShaderMaterial({
  uniforms: amenityAreaUniforms,
  vertexShader: /* glsl */`
    #include <common>
    #include <logdepthbuf_pars_vertex>
    attribute vec3 aColor;
    uniform float uExag;
    uniform float uExtraLift;
    varying vec3 vColor;
    varying vec3 vNormal;
    varying vec3 vWorld;
    void main(){
      vec3 p = position;
      p.z = p.z * uExag + uExtraLift;
      vNormal = normalize(normal);
      vColor = aColor;
      vWorld = p;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    #include <common>
    #include <logdepthbuf_pars_fragment>
    varying vec3 vNormal;
    varying vec3 vColor;
    varying vec3 vWorld;
    uniform vec3 uSun;
    uniform vec3 uFogColor;
    uniform float uFogNear, uFogFar;
    uniform float uFadeNear, uFadeFar;
    void main(){
      #include <logdepthbuf_fragment>
      vec3 N = normalize(vNormal);
      float diff = clamp(dot(N, normalize(uSun)), 0.0, 1.0);
      float wrap = 0.55 + 0.55 * diff;
      vec3 col = vColor * wrap;
      float dist = length(vWorld - cameraPosition);
      float fogF = smoothstep(uFogNear, uFogFar, dist);
      col = mix(col, uFogColor, fogF);
      float alpha = 1.0 - smoothstep(uFadeNear, uFadeFar, dist);
      if (alpha < 0.01) discard;
      gl_FragColor = vec4(col, alpha);
    }`,
  transparent: true,
  depthWrite: true,
  polygonOffset: true,
  polygonOffsetFactor: -1,
  polygonOffsetUnits: -4,
});

// Toon-shaded prop material (instanced, per-vertex color attribute).
const amenityPropUniforms = {
  uExag:     { value: 1.4 },
  uSun:      { value: SUN.clone() },
  uFogNear:  { value: FOG_NEAR },
  uFogFar:   { value: FOG_FAR },
  uFogColor: { value: FOG_COLOR },
  uFadeNear: { value: 3500 },
  uFadeFar:  { value: 5000 },
};
const amenityPropMaterial = new THREE.ShaderMaterial({
  uniforms: amenityPropUniforms,
  vertexShader: /* glsl */`
    #include <common>
    #include <logdepthbuf_pars_vertex>
    attribute vec3 color;
    attribute vec3 iPos;
    attribute float iRot;
    attribute float iScale;
    uniform float uExag;
    varying vec3 vColor;
    varying vec3 vNormal;
    varying vec3 vWorld;
    void main(){
      vec3 p = position * iScale;
      float c = cos(iRot), s = sin(iRot);
      vec2 r = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
      p.x = r.x; p.y = r.y;
      p.x += iPos.x;
      p.y += iPos.y;
      p.z += iPos.z * uExag + 0.05;
      vec3 N = normal;
      vec2 nr = vec2(c*N.x - s*N.y, s*N.x + c*N.y);
      vNormal = normalize(vec3(nr, N.z));
      vColor = color;
      vWorld = p;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    #include <common>
    #include <logdepthbuf_pars_fragment>
    varying vec3 vNormal;
    varying vec3 vColor;
    varying vec3 vWorld;
    uniform vec3 uSun, uFogColor;
    uniform float uFogNear, uFogFar, uFadeNear, uFadeFar;
    void main(){
      #include <logdepthbuf_fragment>
      vec3 N = normalize(vNormal);
      float d = clamp(dot(N, normalize(uSun)), 0.0, 1.0);
      // cartoonish 3-band toon
      float band = d > 0.65 ? 1.0 : (d > 0.30 ? 0.78 : 0.55);
      vec3 col = vColor * band;
      float dist = length(vWorld - cameraPosition);
      float fogF = smoothstep(uFogNear, uFogFar, dist);
      col = mix(col, uFogColor, fogF);
      float alpha = 1.0 - smoothstep(uFadeNear, uFadeFar, dist);
      if (alpha < 0.01) discard;
      gl_FragColor = vec4(col, alpha);
    }`,
  transparent: true,
  depthWrite: true,
});

function _propBox(w, l, h, ox, oy, oz, color){
  const g = new THREE.BoxGeometry(w, l, h);
  g.translate(ox, oy, oz + h * 0.5);
  const n = g.attributes.position.count;
  const c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ c[i*3]=color[0]; c[i*3+1]=color[1]; c[i*3+2]=color[2]; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return g;
}
function _propCyl(r, h, ox, oy, oz, color, radial=8){
  const g = new THREE.CylinderGeometry(r, r, h, radial);
  g.rotateX(Math.PI / 2); // Y-up → Z-up
  g.translate(ox, oy, oz + h * 0.5);
  const n = g.attributes.position.count;
  const c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ c[i*3]=color[0]; c[i*3+1]=color[1]; c[i*3+2]=color[2]; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return g;
}
function _propSphere(r, ox, oy, oz, color){
  const g = new THREE.SphereGeometry(r, 8, 6);
  g.translate(ox, oy, oz);
  const n = g.attributes.position.count;
  const c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ c[i*3]=color[0]; c[i*3+1]=color[1]; c[i*3+2]=color[2]; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return g;
}

function _amHash(x, y){
  let h = (Math.floor(x * 31.7) ^ Math.floor(y * 19.3)) >>> 0;
  h = ((h * 0x27d4eb2d) ^ (h >>> 15)) >>> 0;
  return (h & 0xffff) / 65535;
}

(async () => {
  let ab;
  try { ab = await (await fetch('amenities.bin')).arrayBuffer(); }
  catch (e) { console.warn('amenities.bin not loaded:', e); return; }
  if (ab.byteLength < 8) { console.warn('amenities.bin too small'); return; }
  const dv = new DataView(ab);
  const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
  if (magic !== 'AMN1'){ console.warn('amenities.bin bad magic ' + magic); return; }

  // ---- AREAS ----
  const nAreas = dv.getUint32(4, true);
  let off = 8;
  const areasByType = new Map();
  for (let i = 0; i < nAreas; i++){
    const tid = dv.getUint16(off, true); off += 2;
    const nv  = dv.getUint16(off, true); off += 2;
    /* baseZ */ dv.getFloat32(off, true); off += 4;
    const positions = new Float32Array(nv * 3);
    const ring2d = new Array(nv);
    for (let v = 0; v < nv; v++){
      const x = dv.getFloat32(off,     true);
      const y = dv.getFloat32(off + 4, true);
      const z = dv.getFloat32(off + 8, true);
      off += 12;
      positions[v*3+0] = x;
      positions[v*3+1] = y;
      positions[v*3+2] = z;
      ring2d[v] = new THREE.Vector2(x, y);
    }
    let tris;
    try {
      tris = THREE.ShapeUtils.triangulateShape(ring2d, []);
    } catch (e) { continue; }
    if (!tris || !tris.length) continue;
    let arr = areasByType.get(tid);
    if (!arr) { arr = []; areasByType.set(tid, arr); }
    arr.push({ positions, tris });
  }

  // Render order: big background areas first, sporting features painted on top.
  const RENDER_ORDER = [4, 8, 5, 7, 9, 10, 3, 6, 0, 1, 2];
  for (let r = 0; r < RENDER_ORDER.length; r++){
    const tid = RENDER_ORDER[r];
    const list = areasByType.get(tid);
    if (!list || !list.length) continue;
    let totalV = 0, totalI = 0;
    for (const it of list){ totalV += it.positions.length / 3; totalI += it.tris.length * 3; }
    const positions = new Float32Array(totalV * 3);
    const colors    = new Float32Array(totalV * 3);
    const indices   = (totalV > 65535) ? new Uint32Array(totalI) : new Uint16Array(totalI);
    const col = AMENITY_AREA_COLORS[tid] || [0.5, 0.5, 0.5];
    let vOff = 0, iOff = 0;
    for (const it of list){
      const baseV = vOff;
      const pn = it.positions.length / 3;
      positions.set(it.positions, vOff * 3);
      for (let v = 0; v < pn; v++){
        colors[(vOff+v)*3+0] = col[0];
        colors[(vOff+v)*3+1] = col[1];
        colors[(vOff+v)*3+2] = col[2];
      }
      vOff += pn;
      for (const t of it.tris){
        indices[iOff++] = baseV + t[0];
        indices[iOff++] = baseV + t[1];
        indices[iOff++] = baseV + t[2];
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('aColor',   new THREE.BufferAttribute(colors, 3));
    g.setIndex(new THREE.BufferAttribute(indices, 1));
    g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, amenityAreaMaterial);
    mesh.renderOrder = r;       // smaller r drawn first
    mesh.frustumCulled = false;
    amenitiesGroup.add(mesh);
  }

  // ---- POINTS ----
  const nPoints = dv.getUint32(off, true); off += 4;
  const buckets = new Array(PROP_BUILDERS.length);
  for (let i = 0; i < PROP_BUILDERS.length; i++) buckets[i] = [];
  for (let i = 0; i < nPoints; i++){
    const tid = dv.getUint16(off, true);
    const x = dv.getFloat32(off + 4, true);
    const y = dv.getFloat32(off + 8, true);
    const z = dv.getFloat32(off + 12, true);
    off += 16;
    if (tid >= 0 && tid < buckets.length) buckets[tid].push(x, y, z);
  }
  let totalProps = 0;
  for (let tid = 0; tid < PROP_BUILDERS.length; tid++){
    const arr = buckets[tid];
    const m = arr.length / 3;
    if (!m) continue;
    const geom = PROP_BUILDERS[tid]();
    const ig = new THREE.InstancedBufferGeometry();
    ig.setAttribute('position', geom.getAttribute('position'));
    ig.setAttribute('normal',   geom.getAttribute('normal'));
    ig.setAttribute('color',    geom.getAttribute('color'));
    if (geom.index) ig.setIndex(geom.index);
    const iPos = new Float32Array(m * 3);
    const iRot = new Float32Array(m);
    const iScale = new Float32Array(m);
    for (let k = 0; k < m; k++){
      const x = arr[k*3+0], y = arr[k*3+1], z = arr[k*3+2];
      iPos[k*3+0] = x; iPos[k*3+1] = y; iPos[k*3+2] = z;
      const hx = _amHash(x, y);
      const hy = _amHash(y, x + 7.3);
      iRot[k] = hx * Math.PI * 2;
      iScale[k] = 0.85 + hy * 0.30;
    }
    ig.setAttribute('iPos',   new THREE.InstancedBufferAttribute(iPos, 3));
    ig.setAttribute('iRot',   new THREE.InstancedBufferAttribute(iRot, 1));
    ig.setAttribute('iScale', new THREE.InstancedBufferAttribute(iScale, 1));
    ig.instanceCount = m;
    const mesh = new THREE.Mesh(ig, amenityPropMaterial);
    mesh.frustumCulled = false;
    propsGroup.add(mesh);
    totalProps += m;
  }
  amenitiesGroup.visible = document.getElementById('showBld').checked;
  document.getElementById('hud').insertAdjacentHTML('beforeend',
    `<br>amenities: ${nAreas.toLocaleString()} areas · ${totalProps.toLocaleString()} props`);
})();

// ---------- Forest (low-poly conifers / birches at OSM forest cover) ----------
// Rogaland forests are pine-dominant (Norway spruce + Scots pine), all
// cool dark greens with only minor variation. Per-tree colour jitter is
// applied below so neighbours don't share an identical tint.
const TREE_PAL = [
  [0.12, 0.22, 0.12], // 0 spruce
  [0.13, 0.22, 0.12], // 1 pine
  [0.13, 0.23, 0.12], // 2 upper pine/birch
  [0.12, 0.21, 0.11], // 3 stunted pine
];
const TREE_PAL_DARK = [
  [0.07, 0.15, 0.08],
  [0.08, 0.15, 0.08],
  [0.08, 0.16, 0.09],
  [0.07, 0.14, 0.07],
];
const TREE_TRUNK = [0.27, 0.18, 0.10]; // brown
// Aspect = base radius / height. Smaller = taller/narrower (conifer), larger = rounder.
const TREE_ASPECT = [0.30, 0.36, 0.55, 0.40];

// Unit tree geometry: footprint radius ~0.5, total height 1.0 (in unit space).
// Two stacked hexagonal cones (lower wider skirt, upper narrower spike) +
// a tiny 4-sided trunk box. ~22 tris. All vertices duplicated per face for
// flat shading (no `flat` qualifier needed).

const treeVert = /* glsl */`
#include <common>
#include <logdepthbuf_pars_vertex>
attribute float aPart;
attribute vec3 iPos;
attribute vec2 iSize;        // x = base radius (m), y = height (m)
attribute float iRot;        // random yaw
attribute vec3 iCanopyA;     // lower / outer colour
attribute vec3 iCanopyB;     // upper colour
uniform float uExag;
uniform float uExtraLift;
varying vec3 vColor;
varying vec3 vNormal;
varying vec3 vWorld;
void main(){
  vec3 p = position;
  // canopy parts (0,1) scale by (radius, radius, height); trunk (2) scales tightly
  if (aPart < 1.5) {
    p.x *= iSize.x;
    p.y *= iSize.x;
    p.z *= iSize.y;
  } else {
    p.x *= iSize.x * 0.18;
    p.y *= iSize.x * 0.18;
    p.z *= iSize.y * 0.18;
  }
  float c = cos(iRot), s = sin(iRot);
  vec2 r = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
  p.x = r.x; p.y = r.y;
  p += iPos;
  // baseZ is already a real terrain elevation; lift it by exag (terrain is exaggerated, so trees should sit on top)
  p.z = (iPos.z) * uExag + (p.z - iPos.z) + uExtraLift;
  vec3 N = normal;
  vec2 nr = vec2(c*N.x - s*N.y, s*N.x + c*N.y);
  N = normalize(vec3(nr, N.z));
  vNormal = N;
  if (aPart < 0.5)      vColor = iCanopyA;       // lower skirt
  else if (aPart < 1.5) vColor = iCanopyB;       // upper spike
  else                  vColor = vec3(0.27, 0.18, 0.10); // trunk
  vWorld = p;
  gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
  #include <logdepthbuf_vertex>
}`;
const treeFrag = /* glsl */`
precision highp float;
#include <common>
#include <logdepthbuf_pars_fragment>
varying vec3 vNormal;
varying vec3 vColor;
varying vec3 vWorld;
uniform vec3 uSun;
uniform vec3 uFogColor;
uniform float uFogNear;
uniform float uFogFar;
uniform float uFadeNear;
uniform float uFadeFar;
void main(){
  #include <logdepthbuf_fragment>
  vec3 N = normalize(vNormal);
  float diff = clamp(dot(N, normalize(uSun)), 0.0, 1.0);
  float wrap = 0.35 + 0.80 * diff;
  vec3 col = vColor * wrap;
  float dist = length(vWorld - cameraPosition);
  float fogF = smoothstep(uFogNear, uFogFar, dist);
  col = mix(col, uFogColor, fogF);
  float alpha = 1.0 - smoothstep(uFadeNear, uFadeFar, dist);
  if (alpha < 0.01) discard;
  gl_FragColor = vec4(col, alpha);
}`;

// ---- Billboard impostor LOD (used beyond LOD_NEAR distance) ----
const treeBbVert = /* glsl */`
#include <common>
#include <logdepthbuf_pars_vertex>
attribute vec2 aQuad;
attribute vec3 iPos;
attribute vec2 iSize;
attribute vec3 iCanopyA;
attribute vec3 iCanopyB;
uniform float uExag;
uniform float uExtraLift;
varying vec3 vColor;
varying vec3 vWorld;
varying vec2 vQuad;
void main(){
  // Tree base in world space (Z-up)
  vec3 base = vec3(iPos.x, iPos.y, iPos.z * uExag + uExtraLift);
  // Camera-facing horizontal right vector (rotation about Z only -> trees stay vertical)
  vec3 toCam = cameraPosition - base;
  toCam.z = 0.0;
  vec3 right = vec3(-1.0, 0.0, 0.0);
  float L = length(toCam);
  if (L > 1e-3) {
    vec3 fwd = toCam / L;
    right = normalize(vec3(-fwd.y, fwd.x, 0.0)); // perpendicular to fwd, in horizontal plane
  }
  // Width tapers from full at base to 0.30 at top -> conical silhouette
  float w = iSize.x * 1.30 * (1.0 - aQuad.y * 0.70);
  float h = iSize.y * 1.05;
  vec3 world = base + right * aQuad.x * w + vec3(0.0, 0.0, aQuad.y * h);
  vColor = mix(iCanopyA, iCanopyB, aQuad.y);
  vWorld = world;
  vQuad = aQuad;
  gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
  #include <logdepthbuf_vertex>
}`;
const treeBbFrag = /* glsl */`
precision highp float;
#include <common>
#include <logdepthbuf_pars_fragment>
varying vec3 vColor;
varying vec3 vWorld;
varying vec2 vQuad;
uniform vec3 uSun;
uniform vec3 uFogColor;
uniform float uFogNear;
uniform float uFogFar;
uniform float uFadeNear;
uniform float uFadeFar;
void main(){
  #include <logdepthbuf_fragment>
  // soft conical alpha mask: opaque in centre, fading at outer edge
  float u = abs(vQuad.x);
  float taper = 1.0 - vQuad.y * 0.80; // matches geometry taper
  float r = u / max(0.05, taper);
  float mask = 1.0 - smoothstep(0.78, 1.0, r);
  if (mask < 0.05) discard;
  // simple top-lit shading
  float light = 0.55 + 0.55 * vQuad.y;
  vec3 col = vColor * light;
  float dist = length(vWorld - cameraPosition);
  float fogF = smoothstep(uFogNear, uFogFar, dist);
  col = mix(col, uFogColor, fogF);
  float alpha = mask * (1.0 - smoothstep(uFadeNear, uFadeFar, dist));
  if (alpha < 0.02) discard;
  gl_FragColor = vec4(col, alpha);
}`;

const canopyVert = /* glsl */`
#include <common>
#include <logdepthbuf_pars_vertex>
uniform float uExag;
uniform float uExtraLift;
varying vec3 vWorld;
varying float vBaseZ;
varying float vDist;
void main(){
  float baseZ = position.z;
  // canopy thickness from elevation band (matches forest_polys.py)
  float h;
  if (baseZ < 50.0)       h = 15.0;
  else if (baseZ < 200.0) h = 12.5;
  else if (baseZ < 400.0) h = 9.0;
  else if (baseZ < 600.0) h = 6.0;
  else                    h = 3.5;
  vec3 world = vec3(position.x, position.y, baseZ * uExag + uExtraLift + h);
  vWorld = world;
  vBaseZ = baseZ;
  vec4 vp = viewMatrix * vec4(world, 1.0);
  vDist = -vp.z;
  gl_Position = projectionMatrix * vp;
  #include <logdepthbuf_vertex>
}`;

const canopyFrag = /* glsl */`
precision highp float;
#include <common>
#include <logdepthbuf_pars_fragment>
varying vec3 vWorld;
varying float vBaseZ;
varying float vDist;
uniform vec3 uSun;
uniform vec3 uFogColor;
uniform float uFogNear, uFogFar;
uniform float uFadeNear, uFadeFar;
uniform float uRangeNear, uRangeFar;

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  return 0.55*vnoise(p) + 0.28*vnoise(p*2.07) + 0.14*vnoise(p*4.17);
}

void main(){
  #include <logdepthbuf_fragment>
  vec3 N = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
  float n1 = fbm(vWorld.xy * 0.013);
  float n2 = fbm(vWorld.xy * 0.045 + 17.0);
  float n  = clamp(n1*0.7 + n2*0.3, 0.0, 1.0);
  // desaturated greens tuned to terrain bands (emerald -> deep forest -> mossy olive)
  vec3 dark  = vec3(0.06, 0.17, 0.08);
  vec3 mid   = vec3(0.10, 0.24, 0.11);
  vec3 light = vec3(0.17, 0.31, 0.15);
  vec3 base = mix(dark, mid,  smoothstep(0.20, 0.55, n));
  base      = mix(base, light, smoothstep(0.60, 0.85, n));
  // alpine desaturation: shift toward peat-heath grey-green at altitude
  float alt = clamp((vBaseZ - 350.0) / 350.0, 0.0, 1.0);
  base = mix(base, base*0.80 + vec3(0.07, 0.07, 0.05)*0.20, alt*0.60);
  float NdL = clamp(dot(N, uSun), 0.0, 1.0);
  vec3 col = base * (0.40 + 0.65 * NdL);
  float fogF = smoothstep(uFogNear, uFogFar, vDist);
  col = mix(col, uFogColor, fogF);
  float aIn  = smoothstep(uFadeNear, uFadeFar, vDist);
  float aOut = 1.0 - smoothstep(uRangeNear, uRangeFar, vDist);
  float alpha = aIn * aOut;
  if (alpha < 0.01) discard;
  gl_FragColor = vec4(col, alpha);
}`;

(async () => {

    const ab = await (await fetch('canopy.bin')).arrayBuffer();
    const dv = new DataView(ab);
    const magic = String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3));
    if (magic !== 'CANO') throw new Error('bad canopy magic ' + magic);
    const ver = dv.getUint32(4, true);
    const nCells = dv.getUint32(8, true);
    let off = 12;
    let totalTris = 0;
    for (let i = 0; i < nCells; i++){

      const nV     = dv.getUint32(off, true);  off += 4;
      const nT     = dv.getUint32(off, true);  off += 4;
      // copy out so the master ArrayBuffer can be GC'd
      const verts   = new Float32Array(ab, off, nV * 3).slice();
      off += nV * 12;
      const indices = new Uint16Array(ab, off, nT * 3).slice();
      off += nT * 6;
      if ((nT * 3) & 1) off += 2;

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      geom.setIndex(new THREE.BufferAttribute(indices, 1));
      const mesh = new THREE.Mesh(geom, canopyMaterial);

      mesh.renderOrder = 1;
      canopyGroup.add(mesh);

const treeCells = [];

(async () => {
  try {
    const ab = await (await fetch('forest.bin')).arrayBuffer();
    const dv = new DataView(ab);
    const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
    if (magic !== 'TRE1' && magic !== 'TRE2') throw new Error('bad magic ' + magic);
    const TRE2 = (magic === 'TRE2');
    const n = dv.getUint32(4, true);
    // TRE1: 20 B (cx,cy,cz,h,sp,sj,cj,pad). TRE2: 24 B (adds 4 int8 corner-z deltas
    // d00,d10,d01,d11 in 0.5 m units, used to bilinear-interp per-tree z and
    // avoid horizontal "tree shelves" on steep slopes).
    const REC = TRE2 ? 24 : 20;
    const dataOff = 8;
    const tmp = new DataView(ab, dataOff);
    // bin into 4 km cells
    const CELL = 4000;
    const bins = new Map();
    for (let i = 0; i < n; i++){
      const o = i * REC;
      const cx = tmp.getFloat32(o + 0, true);
      const cy = tmp.getFloat32(o + 4, true);
      const gx = Math.floor(cx / CELL);
      const gy = Math.floor(cy / CELL);
      const k = gx * 100000 + gy;
      let arr = bins.get(k);
      if (!arr) { arr = []; bins.set(k, arr); }
      arr.push(i);
    }
    const treeGeom = makeTreeGeometry();
    // Procedural densification: each forest quad has ONE seed at its centre;
    // we scatter K trees uniformly across the 48 m quad → ~24 m effective spacing,
    // no clustering and no gaps.
    const K_TREES = 16;
    const QUAD_M = 48.0;
    const JITTER_R = QUAD_M * 0.5;  // ±24 m → covers the whole quad
    const BASE_SINK = 1.2;
    const jh = (a, b) => {
      let x = (a * 374761393 ^ b * 668265263) | 0;
      x = (x ^ (x >>> 13)) * 1274126177 | 0;
      x = x ^ (x >>> 16);
      return ((x >>> 0) / 0xffffffff) * 2.0 - 1.0;
    };
    let totalCells = 0;
    let totalInstances = 0;
    for (const [, idxArr] of bins){
      const m = idxArr.length;
      if (!m) continue;
      const M = m * K_TREES;
      const iPos       = new Float32Array(M * 3);
      const iSize      = new Float32Array(M * 2);
      const iRot       = new Float32Array(M);
      const iCanopyA   = new Float32Array(M * 3);
      const iCanopyB   = new Float32Array(M * 3);
      let bxMin = Infinity, byMin = Infinity, bxMax = -Infinity, byMax = -Infinity;
      let maxH = 0;
      let wi = 0;
      for (let k = 0; k < m; k++){
        const seedIdx = idxArr[k];
        const o = seedIdx * REC;
        const cx0 = tmp.getFloat32(o + 0, true);
        const cy0 = tmp.getFloat32(o + 4, true);
        const bz0 = tmp.getFloat32(o + 8, true);
        const h0  = tmp.getFloat32(o + 12, true);
        const sp  = tmp.getUint8(o + 16);
        const sj  = tmp.getUint8(o + 17);
        const cj  = tmp.getUint8(o + 18);
        // TRE2 corner-z deltas (0.5 m units), int8 - or 0 if TRE1 (no deltas):
        const d00 = TRE2 ? tmp.getInt8(o + 20) * 0.5 : 0;
        const d10 = TRE2 ? tmp.getInt8(o + 21) * 0.5 : 0;
        const d01 = TRE2 ? tmp.getInt8(o + 22) * 0.5 : 0;
        const d11 = TRE2 ? tmp.getInt8(o + 23) * 0.5 : 0;
        const aspect = TREE_ASPECT[sp] || 0.4;
        const A = TREE_PAL[sp] || TREE_PAL[0];
        const B = TREE_PAL_DARK[sp] || TREE_PAL_DARK[0];
        for (let s = 0; s < K_TREES; s++){
          // Stratified jitter: divide quad into K cells, place one tree per cell
          // with a small in-cell offset. Guarantees uniform coverage.
          // Then rotate + shift the whole sub-lattice by a per-quad random
          // amount so adjacent quads don't form a global aligned grid
          // (visible as stripes on steep slopes).
          const sub = K_TREES;
          const nx = Math.ceil(Math.sqrt(sub));
          const sx = s % nx, sy = (s / nx) | 0;
          const baseU = (sx + 0.5) / nx - 0.5;     // [-0.5, 0.5]
          const baseV = (sy + 0.5) / nx - 0.5;
          const ru = jh(seedIdx, s * 2 + 1) * (0.5 / nx) * 0.95;
          const rv = jh(seedIdx, s * 2 + 2) * (0.5 / nx) * 0.95;
          let u = baseU + ru;
          let v = baseV + rv;
          // per-quad rotation of the sub-lattice (breaks global row alignment)
          const theta = jh(seedIdx, 9991) * Math.PI;       // [-π, π]
          const ct = Math.cos(theta), st = Math.sin(theta);
          const u2 =  ct * u - st * v;
          const v2 =  st * u + ct * v;
          // per-quad sub-lattice shift (breaks shared phase across quads)
          const offU = jh(seedIdx, 9992) * 0.45;            // ±0.45 of QUAD_M
          const offV = jh(seedIdx, 9993) * 0.45;
          const cx = cx0 + (u2 + offU) * QUAD_M;
          const cy = cy0 + (v2 + offV) * QUAD_M;
          // Bilinear-interp per-tree z from corner deltas so trees follow the
          // local slope inside the 48 m quad (eliminates horizontal "shelves"
          // of trees on steep terrain). u,v in [0,1] across the quad.
          // Clamp to [0,1] because per-quad rotation/offset can push trees
          // slightly outside their own quad.
          const fu = Math.max(0, Math.min(1, (u2 + offU) + 0.5));
          const fv = Math.max(0, Math.min(1, (v2 + offV) + 0.5));
          const dz = (d00 * (1 - fu) * (1 - fv))
                   + (d10 *      fu  * (1 - fv))
                   + (d01 * (1 - fu) *      fv )
                   + (d11 *      fu  *      fv );
          // per-sub-tree size & rotation variation (deterministic)
          const rh1 = jh(seedIdx, 100 + s);
          const rh2 = jh(seedIdx, 200 + s);
          const rh3 = jh(seedIdx, 300 + s);
          const sjF = sj / 255.0 + rh1 * 0.20;
          const rJit = 0.80 + Math.max(0, Math.min(1, sjF)) * 0.35;
          const hJit = 0.85 + Math.max(0, Math.min(1, sjF)) * 0.25;
          const radius = Math.max(0.6, h0 * aspect * rJit);
          const height = Math.max(2.0, h0 * hJit);
          const tShift = ((cj - 128) / 600.0) + rh2 * 0.06;
          iPos[wi*3+0] = cx;
          iPos[wi*3+1] = cy;
          iPos[wi*3+2] = bz0 + dz - BASE_SINK;
          iSize[wi*2+0] = radius;
          iSize[wi*2+1] = height;
          iRot[wi] = (cj / 255.0 + rh3 * 0.5) * Math.PI * 2.0;
          // Per-tree colour jitter. Use sub-tree-specific hashes so the
          // K_TREES sub-trees within one quad don't share a tint (no quilt).
          const jLum = jh(seedIdx, 401 + s) * 0.05;     // overall brightness
          const jR   = jh(seedIdx, 411 + s) * 0.025;    // red micro-shift
          const jG   = jh(seedIdx, 421 + s) * 0.035;    // green micro-shift
          const jB   = jh(seedIdx, 431 + s) * 0.025;    // blue micro-shift
          iCanopyA[wi*3+0] = Math.max(0.04, Math.min(0.5, A[0] + jLum + jR));
          iCanopyA[wi*3+1] = Math.max(0.04, Math.min(0.5, A[1] + jLum + jG));
          iCanopyA[wi*3+2] = Math.max(0.04, Math.min(0.5, A[2] + jLum + jB));
          iCanopyB[wi*3+0] = Math.max(0.03, Math.min(0.4, B[0] + jLum + jR));
          iCanopyB[wi*3+1] = Math.max(0.03, Math.min(0.4, B[1] + jLum + jG));
          iCanopyB[wi*3+2] = Math.max(0.03, Math.min(0.4, B[2] + jLum + jB));
          if (cx < bxMin) bxMin = cx; if (cy < byMin) byMin = cy;
          if (cx > bxMax) bxMax = cx; if (cy > byMax) byMax = cy;
          if (height > maxH) maxH = height;
          wi++;
        }
      }
      const cellCx = (bxMin + bxMax) / 2, cellCy = (byMin + byMax) / 2;
      const radius = Math.hypot(bxMax - cellCx, byMax - cellCy) + 30;

      const aPos      = new THREE.InstancedBufferAttribute(iPos, 3);
      const aSize     = new THREE.InstancedBufferAttribute(iSize, 2);
      const aRot      = new THREE.InstancedBufferAttribute(iRot, 1);
      const aCanopyA  = new THREE.InstancedBufferAttribute(iCanopyA, 3);
      const aCanopyB  = new THREE.InstancedBufferAttribute(iCanopyB, 3);

      const ig = new THREE.InstancedBufferGeometry();
      ig.setAttribute('position', treeGeom.getAttribute('position'));
      ig.setAttribute('normal',   treeGeom.getAttribute('normal'));
      ig.setAttribute('aPart',    treeGeom.getAttribute('aPart'));
      ig.setAttribute('iPos',     aPos);
      ig.setAttribute('iSize',    aSize);
      ig.setAttribute('iRot',     aRot);
      ig.setAttribute('iCanopyA', aCanopyA);
      ig.setAttribute('iCanopyB', aCanopyB);
      ig.instanceCount = M;
      const mesh = new THREE.Mesh(ig, treeMaterial);
      mesh.frustumCulled = false;
      mesh.renderOrder = 1;
      treesGroup.add(mesh);
      totalInstances += M;

      // Billboard mesh removed - canopy carpet covers distant view now.

      treeCells.push({ mesh, cx: cellCx, cy: cellCy, radius, maxH, count: m });
      totalCells++;
    }
    document.getElementById('hud').insertAdjacentHTML('beforeend',
      `<br>trees: ${totalInstances.toLocaleString()} (×${K_TREES} from ${n.toLocaleString()} seeds) in ${totalCells} cells, < ${(CANOPY_LOD_HI/1000).toFixed(1)} km`);
  } catch (e) {
    console.warn('forest.bin not loaded:', e);
  }
})();


const loader = new THREE.TextureLoader();
const tileCache = new Map();
const MAX_CACHE = 400;

function tileKey(z,x,y){ return terrainTileKey(z,x,y); }
function getTile(z,x,y) {
  const k = tileKey(z,x,y);
  let t = tileCache.get(k);
  if (t) { t.lastUsed = performance.now(); return t; }
  t = { tex:null, lastUsed: performance.now(), loading:true, missing:false };
  tileCache.set(k, t);
  loader.load(tileUrl(z,x,y), tex => {
    tex.flipY = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.colorSpace = THREE.NoColorSpace;
    t.tex = tex; t.loading = false;
  }, undefined, () => { t.loading = false; t.missing = true; });
  return t;
}
function evictCache(){
  if (tileCache.size <= MAX_CACHE) return;
  const arr = [...tileCache.entries()].sort((a,b) => a[1].lastUsed - b[1].lastUsed);
  const drop = arr.slice(0, tileCache.size - MAX_CACHE);
  for (const [k, v] of drop) {
    if (v.tex) v.tex.dispose();
    tileCache.delete(k);
  }
}

let SEG = DEFAULT_SEGMENTS;
let plane = new THREE.PlaneGeometry(1, 1, SEG, SEG);

// ---------- shader ----------
const vert = /* glsl */`
#include <common>
#include <logdepthbuf_pars_vertex>
uniform sampler2D uHeight;
uniform vec2 uOriginXY;
uniform float uTileSize;
uniform float uExag;
uniform vec2 uUVScale;
uniform vec2 uUVOffset;
varying vec3 vWorld;
varying vec2 vUv;
varying float vH;
float decode(vec3 c){ return -10000.0 + (c.r*255.0*65536.0 + c.g*255.0*256.0 + c.b*255.0)*0.1; }
void main(){
  vUv = uv;
  vec2 sUv = uUVOffset + uv * uUVScale;
  vec2 tuv = vec2(sUv.x, 1.0 - sUv.y);
  float h = decode(texture2D(uHeight, tuv).rgb);
  h = max(h, 0.0) * uExag;
  vec2 wxy = uOriginXY + uv * uTileSize;
  vWorld = vec3(wxy, h);
  vH = h;

  #include <logdepthbuf_vertex>

const frag = /* glsl */`
precision highp float;
#include <common>
#include <logdepthbuf_pars_fragment>
uniform sampler2D uHeight;
uniform float uTileSize;
uniform float uExag;
uniform float uElevMax;
uniform float uSeg;
uniform vec3 uSun;
uniform vec2 uUVScale;
uniform vec2 uUVOffset;
uniform float uFogNear;
uniform float uFogFar;
uniform vec3 uFogColor;
// ----- geology overlay uniforms (shared across all terrain materials) -----
uniform sampler2D uBedTex;
uniform sampler2D uBedPalette;
uniform float uBedShow;       // 0 or 1
uniform float uBedPalN;       // number of palette entries (>= 1)
uniform sampler2D uQuatTex;
uniform sampler2D uQuatPalette;
uniform float uQuatShow;
uniform float uQuatPalN;
uniform vec4 uGeoBBox;        // xMin, yMin, xMax-xMin, yMax-yMin (centred world)
uniform float uGeoOpacity;
// ----- contour uniforms (shared across all terrain materials) -----
uniform float uContourShow;       // 0 or 1
uniform float uContourInterval;   // metres (real world)
uniform float uContourBoldEvery;  // e.g. 5 -> every 5th line is an index contour
uniform vec3  uContourColor;
uniform vec3  uContourBoldColor;
uniform float uContourOpacity;
// ----- road overlay uniforms (shared across all terrain materials) -----
uniform sampler2D uRoadGrid;      // RG float, per-cell (offset, count) into uRoadRefs
uniform sampler2D uRoadRefs;      // RGBA float, per ref (ax, ay, bx, by) centred world
uniform sampler2D uRoadCls;       // R8, per ref class (0..4) stored as cls/255
uniform vec2  uRoadOrigin;        // (xMinC, yMinC) — bottom-left of grid in centred coords
uniform float uRoadCell;          // metres per grid cell
uniform vec2  uRoadGridDims;      // (gridW, gridH)
uniform vec2  uRoadRefsDims;      // (refsTexW, refsTexH)
uniform float uRoadShow;          // 0 or 1
uniform float uRoadReady;         // 0 until osm.bin is parsed and textures uploaded
varying vec3 vWorld;
varying vec2 vUv;
varying float vH;
float decode(vec3 c){ return -10000.0 + (c.r*255.0*65536.0 + c.g*255.0*256.0 + c.b*255.0)*0.1; }
float sampleH(vec2 uv){
  vec2 sUv = uUVOffset + uv * uUVScale;
  vec2 tuv = vec2(sUv.x, 1.0 - sUv.y);
  return max(decode(texture2D(uHeight, tuv).rgb), 0.0) * uExag;
}
vec4 sampleGeo(sampler2D tex, sampler2D pal, float palN, vec2 wxy) {
  vec2 uv = vec2((wxy.x - uGeoBBox.x) / uGeoBBox.z, (wxy.y - uGeoBBox.y) / uGeoBBox.w);
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec4(0.0);
  vec2 rg = texture2D(tex, uv).rg;
  float idF = floor(rg.r * 255.0 + 0.5) + floor(rg.g * 255.0 + 0.5) * 256.0;
  if (idF < 0.5 || palN < 1.0) return vec4(0.0);
  vec2 puv = vec2((idF - 0.5) / palN, 0.5);
  return vec4(texture2D(pal, puv).rgb, 1.0);
}
// Compute centre-of-texel UV for a 1-D ref index packed into the (refsTexW × refsTexH) texture.
vec2 _refUV(float i){
  float w = uRoadRefsDims.x;
  float h = uRoadRefsDims.y;
  float row = floor(i / w);
  float colF = i - row * w;
  return vec2((colF + 0.5) / w, (row + 0.5) / h);
}
float _distSeg(vec2 p, vec2 a, vec2 b){
  vec2 d = b - a;
  float L2 = max(dot(d, d), 1e-6);
  float t = clamp(dot(p - a, d) / L2, 0.0, 1.0);
  return length(p - (a + d * t));
}
vec3 ramp(float zReal){
  // Rogaland palette: emerald coastal forest → mossy heath → dark upland heath.
  // No tans/golds — Norwegian uplands are heather/crowberry/peat, not dry grass.
  vec3 c0 = vec3(0.07, 0.26, 0.10); //   0– 30 m  emerald coastal forest
  vec3 c1 = vec3(0.10, 0.28, 0.11); //  30–100 m  deep forest green
  vec3 c2 = vec3(0.16, 0.28, 0.13); // 100–200 m  mossy green, browner
  vec3 c3 = vec3(0.18, 0.24, 0.13); // 200–320 m  dark heath (olive-brown)
  vec3 c4 = vec3(0.20, 0.21, 0.15); // 320–400 m  peat/heath, hint of purple
  if (zReal <  30.0) return c0;
  if (zReal < 100.0) return c1;
  if (zReal < 200.0) return c2;
  if (zReal < 320.0) return c3;
  return c4;
}
void main(){
  #include <logdepthbuf_fragment>
  // identify the current quad cell of the geometry tessellation
  vec2 q  = floor(vUv * uSeg) / uSeg;
  float d = 1.0 / uSeg;
  // sample heights at the 4 corners of the quad
  float h00 = sampleH(q);
  float h10 = sampleH(q + vec2(d, 0.0));
  float h01 = sampleH(q + vec2(0.0, d));
  float h11 = sampleH(q + vec2(d, d));
  float havg = 0.25 * (h00 + h10 + h01 + h11);
  float dxM = d * uTileSize;
  vec3 n1 = normalize(cross(vec3(dxM, 0.0, h10 - h00), vec3(0.0, dxM, h01 - h00)));
  vec3 n2 = normalize(cross(vec3(0.0, dxM, h11 - h10), vec3(-dxM, 0.0, h01 - h10)));
  vec3 N  = normalize(n1 + n2);
  float diff = clamp(dot(N, normalize(uSun)), 0.0, 1.0);

  float zReal = havg / max(uExag, 0.001);
  float slope = 1.0 - clamp(N.z, 0.0, 1.0);

  vec3 base = ramp(zReal);

  // Bare granite on steep terrain. Rogaland granite is pale cool grey, almost
  // off-white where freshly exposed, slightly darker/lichen-mottled lower down.
  vec3 rockLo = vec3(0.48, 0.49, 0.50); // wet/mossy granite low down
  vec3 rockHi = vec3(0.66, 0.68, 0.70); // pale Preikestolen / Kjerag granite
  vec3 rockCol = mix(rockLo, rockHi, smoothstep(150.0, 600.0, zReal));
  float rockMix = smoothstep(0.20, 0.50, slope);
  base = mix(base, rockCol, rockMix);

  // Snow above ~400 m; sticks only on gentler slopes.
  vec3 snow = vec3(0.94, 0.96, 0.99);
  float snowAlt   = smoothstep(380.0, 470.0, zReal);
  float snowSlope = 1.0 - smoothstep(0.28, 0.55, slope);
  float snowF = snowAlt * snowSlope;
  base = mix(base, snow, snowF);

  if (havg < 1.0) base = vec3(0.10, 0.18, 0.28);
  vec3 col = base * (0.40 + 0.70 * diff);
  // --- geology overlay (raster-textured, no separate mesh, no pokethrough) ---
  if (uBedShow > 0.5) {
    vec4 g = sampleGeo(uBedTex, uBedPalette, uBedPalN, vWorld.xy);
    col = mix(col, g.rgb * (0.40 + 0.70 * diff), g.a * uGeoOpacity);
  }
  if (uQuatShow > 0.5) {
    vec4 g = sampleGeo(uQuatTex, uQuatPalette, uQuatPalN, vWorld.xy);
    col = mix(col, g.rgb * (0.40 + 0.70 * diff), g.a * uGeoOpacity);
  }
  // --- contour lines (procedural iso-lines on the height field) ---
  if (uContourShow > 0.5) {
    float interval = max(uContourInterval, 0.001);
    float zReal = sampleH(vUv) / max(uExag, 0.001);
    float f = zReal / interval;
    float w = max(fwidth(f), 1e-5);
    float dist = abs(fract(f + 0.5) - 0.5);
    // anti-aliased line ~1.5 px wide
    float lineA = 1.0 - smoothstep(0.0, w * 0.75, dist);
    // density fade: kill lines when they'd merge into a wash
    float densityFade = 1.0 - smoothstep(0.4, 0.7, w);
    lineA *= densityFade;
    // bold "index" contour every Nth line
    float every = max(uContourBoldEvery, 1.0);
    float isBold = step(mod(floor(f + 0.5), every), 0.5);
    float boldA = (1.0 - smoothstep(0.0, w * 1.6, dist)) * densityFade * isBold;
    // smooth sea-level mask (avoids hard branch around fwidth)
    float landMask = smoothstep(0.5, 2.0, zReal);
    vec3 lineCol = mix(uContourColor, uContourBoldColor, isBold);
    float a = max(lineA * 0.55, boldA * 0.9) * uContourOpacity * landMask;
    col = mix(col, lineCol, a);
  }
  // --- roads (shader overlay; spatial-grid lookup of nearest OSM segment) ---
  if (uRoadShow > 0.5 && uRoadReady > 0.5) {
    vec2 p = vWorld.xy;
    vec2 cf = (p - uRoadOrigin) / uRoadCell;
    vec2 cellF = floor(cf);
    float minDist = 1e9;
    float minClsF = -1.0;
    for (int dy = -1; dy <= 1; dy++) {
      for (int dx = -1; dx <= 1; dx++) {
        vec2 c = cellF + vec2(float(dx), float(dy));
        if (c.x < 0.0 || c.y < 0.0 || c.x >= uRoadGridDims.x || c.y >= uRoadGridDims.y) continue;
        vec2 cellUV = vec2((c.x + 0.5) / uRoadGridDims.x, (c.y + 0.5) / uRoadGridDims.y);
        vec2 hdr = texture2D(uRoadGrid, cellUV).rg;
        float off = hdr.r;
        float cnt = hdr.g;
        for (int k = 0; k < 128; k++) {
          if (float(k) >= cnt) break;
          float ri = off + float(k);
          vec2 ruv = _refUV(ri);
          vec4 s = texture2D(uRoadRefs, ruv);
          float d = _distSeg(p, s.xy, s.zw);
          if (d < minDist) {
            minDist = d;
            minClsF = floor(texture2D(uRoadCls, ruv).r * 255.0 + 0.5);
          }
        }
      }
    }
    if (minClsF >= 0.0) {
      int minCls = int(minClsF);
      float halfW = (minCls == 0) ? 6.5 :
                    (minCls == 1) ? 5.0 :
                    (minCls == 2) ? 4.0 :
                    (minCls == 3) ? 3.25 : 2.75;
      float aaw = max(fwidth(minDist), 0.25);
      float coreT = 1.0 - smoothstep(halfW - aaw, halfW + aaw, minDist);
      vec3 coreCol = (minCls == 0) ? vec3(0.165, 0.165, 0.175) :
                     (minCls == 1) ? vec3(0.180, 0.180, 0.185) :
                     (minCls == 2) ? vec3(0.210, 0.205, 0.180) :
                     (minCls == 3) ? vec3(0.225, 0.215, 0.195) :
                                     vec3(0.240, 0.225, 0.205);
      // subtle per-metre hash grain to break up flat asphalt
      float grain = fract(sin(dot(floor(vWorld.xy), vec2(12.9898, 78.233))) * 43758.5453);
      coreCol *= (0.90 + 0.18 * grain);
      vec3 roadShaded = coreCol * (0.40 + 0.70 * diff);
      // Thin lighter shoulder for motorways/trunks
      if (minCls <= 1) {
        float edgeHi = halfW + 0.6;
        float edgeT = (1.0 - smoothstep(edgeHi - aaw, edgeHi + aaw, minDist)) - coreT;
        edgeT = clamp(edgeT, 0.0, 1.0);
        vec3 edgeCol = vec3(0.55, 0.54, 0.50) * (0.40 + 0.70 * diff);
        col = mix(col, edgeCol, edgeT * 0.85);
      }
      col = mix(col, roadShaded, coreT);
    }
  }
  // distance fog
  float fogF = smoothstep(uFogNear, uFogFar, length(vWorld - cameraPosition));
  col = mix(col, uFogColor, fogF);
  gl_FragColor = vec4(col, 1.0);
}
`;

// Shared geology overlay uniforms — all terrain materials get these
// by reference, so toggling a value affects every tile mesh at once.

  uQuatTex:     { value: _dummyGeoTex },

  uContourBoldColor: { value: new THREE.Color(0x140803) },  // bold: near-black

_dummyRoadGrid.minFilter = THREE.NearestFilter; _dummyRoadGrid.magFilter = THREE.NearestFilter; _dummyRoadGrid.needsUpdate = true;
const _dummyRoadRefs = new THREE.DataTexture(new Float32Array([0,0,0,0]), 1, 1, THREE.RGBAFormat, THREE.FloatType);

const _dummyRoadCls = new THREE.DataTexture(new Uint8Array([0]), 1, 1, THREE.RedFormat, THREE.UnsignedByteType);
_dummyRoadCls.minFilter = THREE.NearestFilter; _dummyRoadCls.magFilter = THREE.NearestFilter; _dummyRoadCls.needsUpdate = true;
const roadUniforms = {
  uRoadGrid:      { value: _dummyRoadGrid },
  uRoadRefs:      { value: _dummyRoadRefs },
  uRoadCls:       { value: _dummyRoadCls },
  uRoadOrigin:    { value: new THREE.Vector2(0, 0) },
  uRoadCell:      { value: 500.0 },
  uRoadGridDims:  { value: new THREE.Vector2(1, 1) },
  uRoadRefsDims:  { value: new THREE.Vector2(1, 1) },
  uRoadShow:      { value: 1.0 },
  uRoadReady:     { value: 0.0 },
};

function makeMaterial(){
  return new THREE.ShaderMaterial({
    polygonOffset: true,
    polygonOffsetFactor: 1,
    polygonOffsetUnits: 1,
    uniforms: {
      uHeight:   { value: null },
      uOriginXY: { value: new THREE.Vector2() },
      uTileSize: { value: 1 },
      uExag:     { value: 1.4 },
      uElevMax:  { value: ELEV_MAX },
      uSun:      { value: SUN.clone() },
      uSeg:      { value: SEG },
      uUVScale:  { value: new THREE.Vector2(1,1) },
      uUVOffset: { value: new THREE.Vector2(0,0) },
      uFogNear:  { value: FOG_NEAR },
      uFogFar:   { value: FOG_FAR },
      uFogColor: { value: FOG_COLOR },
      // geology overlay (shared-by-reference; updated once per uniform):
      uBedTex:      geoUniforms.uBedTex,
      uBedPalette:  geoUniforms.uBedPalette,
      uBedShow:     geoUniforms.uBedShow,
      uBedPalN:     geoUniforms.uBedPalN,
      uQuatTex:     geoUniforms.uQuatTex,
      uQuatPalette: geoUniforms.uQuatPalette,
      uQuatShow:    geoUniforms.uQuatShow,
      uQuatPalN:    geoUniforms.uQuatPalN,
      uGeoBBox:     geoUniforms.uGeoBBox,
      uGeoOpacity:  geoUniforms.uGeoOpacity,
      // contour overlay (shared-by-reference):
      uContourShow:      contourUniforms.uContourShow,

// ---------------- geology raster overlay (BRR1 / QRR1) -----------------
// Bedrock + Quaternary are rendered as 2D rasters sampled by the terrain
// fragment shader. Each pixel stores a uint16 class id (0 = nodata, 1..N
// = palette index). Eliminates the pokethrough that the polygon-mesh
// approach suffered from on steep terrain (e.g. Ålgård).
let bedrockLookup = {};      // "1".. -> {name, color, scale}
let quaternaryLookup = {};
let bedrockRaster = null;    // { w, h, ids: Uint16Array, bbox: {xMin,yMin,xMax,yMax} }
let quatRaster    = null;

function _hexToRgbBytes(hex) {
  if (!hex || hex.length !== 7) return [180, 180, 180];
  return [
    parseInt(hex.slice(1,3), 16),
    parseInt(hex.slice(3,5), 16),
    parseInt(hex.slice(5,7), 16),
  ];
}

function _buildPaletteTex(lookupObj) {
  // Find max id, build N x 1 RGBA8 texture (idx 0 = nodata = transparent).
  let maxId = 0;
  for (const k of Object.keys(lookupObj)) {
    const n = parseInt(k, 10);
    if (n > maxId) maxId = n;
  }
  const N = maxId + 1;
  const data = new Uint8Array(N * 4);
  for (let i = 0; i < N; i++) {
    const entry = lookupObj[String(i)];
    if (entry && entry.color) {
      const [r, g, b] = _hexToRgbBytes(entry.color);
      data[i*4 + 0] = r;
      data[i*4 + 1] = g;
      data[i*4 + 2] = b;
      data[i*4 + 3] = 255;
    } else {
      data[i*4 + 3] = 0;
    }
  }
  const tex = new THREE.DataTexture(data, N, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  return { tex, N };
}

async function _loadGeologyRaster(binUrl, paletteUrl, magic) {
  let buf, lookupObj = {};
  try {
    const r = await fetch(binUrl);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    buf = await r.arrayBuffer();
  } catch (e) {
    console.warn(`${binUrl} not loaded:`, e.message);
    return null;
  }
  try {
    const jr = await fetch(paletteUrl);
    if (jr.ok) lookupObj = await jr.json();
  } catch {}

  const dv = new DataView(buf);
  const tag = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
  if (tag !== magic) {
    console.warn(`${binUrl}: bad magic ${tag}, expected ${magic}`);
    return null;
  }
  const ver = dv.getUint32(4, true);
  const w = dv.getUint32(8, true);
  const h = dv.getUint32(12, true);
  const xMin = dv.getFloat32(16, true);
  const yMin = dv.getFloat32(20, true);
  const xMax = dv.getFloat32(24, true);
  const yMax = dv.getFloat32(28, true);
  const ids = new Uint16Array(buf, 32, w * h);
  // RG-packed (uint16 low byte in R, high byte in G) view for the GPU
  const rgBytes = new Uint8Array(buf, 32, w * h * 2);
  const tex = new THREE.DataTexture(rgBytes, w, h, THREE.RGFormat, THREE.UnsignedByteType);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.flipY = false;
  tex.needsUpdate = true;
  const palInfo = _buildPaletteTex(lookupObj);
  console.log(`${binUrl}: ${w}x${h} raster, palette N=${palInfo.N}`);
  return {
    w, h, ids, bbox: { xMin, yMin, xMax, yMax },
    tex, paletteTex: palInfo.tex, paletteN: palInfo.N,
    lookup: lookupObj,
  };
}

function _setGeoBBoxFrom(r) {
  // Use the first loaded raster to set the shared bbox. Both layers cover
  // the same DEM extent so the bbox is identical for either.
  geoUniforms.uGeoBBox.value.set(
    r.bbox.xMin,
    r.bbox.yMin,
    r.bbox.xMax - r.bbox.xMin,
    r.bbox.yMax - r.bbox.yMin,
  );
}

(async () => {

    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    buf = await r.arrayBuffer();
  } catch (e) { console.warn('faults.bin not loaded:', e.message); return; }
  const dv = new DataView(buf);
  const tag = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
  if (tag !== 'FLT1') { console.warn('bad faults magic', tag); return; }
  let off = 4;
  const nGroups = dv.getUint32(off, true); off += 4;
  let totalSegs = 0;
  for (let g = 0; g < nGroups; g++) {

    const nVerts = dv.getUint32(off, true); off += 4;
    const verts = new Float32Array(buf, off, nVerts * 3); off += nVerts * 12;
    const positions = new Float32Array(verts.length);
    for (let i = 0; i < nVerts; i++) {
      positions[i*3]   = verts[i*3];
      positions[i*3+1] = verts[i*3+1];
      positions[i*3+2] = verts[i*3+2] * EXAG + 1.0 * EXAG;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const seg = new THREE.LineSegments(geo, faultMat);
    seg.frustumCulled = false;
    seg.renderOrder = 12;

  }

// ---------------- click-to-identify geology (raster lookup) -----------------
function _sampleRaster(r, wx, wy) {
  if (!r) return 0;
  const { bbox, w, h, ids } = r;
  const u = (wx - bbox.xMin) / (bbox.xMax - bbox.xMin);
  const v = (wy - bbox.yMin) / (bbox.yMax - bbox.yMin);
  if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
  let col = Math.floor(u * w);
  let row = Math.floor(v * h);
  if (col >= w) col = w - 1;
  if (row >= h) row = h - 1;
  return ids[row * w + col];
}

function _identify(px, py) {
  const out = {};
  const bid = _sampleRaster(bedrockRaster, px, py);
  if (bid > 0 && bedrockLookup[String(bid)]) out.bedrock = bedrockLookup[String(bid)];
  const qid = _sampleRaster(quatRaster, px, py);
  if (qid > 0 && quaternaryLookup[String(qid)]) out.quat = quaternaryLookup[String(qid)];
  return out;
}

function tileBoundsWorld(z,x,y){
  const b = tileBounds(meta, z, x, y);
  return { xmin: b.x0 - CENTER_X, ymin: b.y0 - CENTER_Y, xmax: b.x1 - CENTER_X, ymax: b.y1 - CENTER_Y, size: b.size };
}
function tileIntersectsSrc(z,x,y){
  const b = tileBounds(meta, z, x, y);
  return !(b.x1 <= SRC.xMin || b.x0 >= SRC.xMax || b.y1 <= SRC.yMin || b.y0 >= SRC.yMax);
}

const _v = new THREE.Vector3();
function projectedSizePx(b){
  const cx = (b.xmin + b.xmax)/2;
  const cy = (b.ymin + b.ymax)/2;
  _v.set(cx, cy, 0);
  const dist = Math.max(camera.position.distanceTo(_v), 1);
  const halfH = Math.tan(camera.fov*Math.PI/360) * dist;
  return (b.size / (2*halfH)) * renderer.domElement.height;
}

const frustum = new THREE.Frustum();
const _box = new THREE.Box3();
const _projMat = new THREE.Matrix4();
const _bmin = new THREE.Vector3();
const _bmax = new THREE.Vector3();
function inFrustum(b){
  _bmin.set(b.xmin, b.ymin, 0);
  _bmax.set(b.xmax, b.ymax, ELEV_MAX*EXAG + 50);
  _box.set(_bmin, _bmax);
  return frustum.intersectsBox(_box);
}

const _cellSphere = new THREE.Sphere();
const _cellCenter = new THREE.Vector3();
function cullBuildings(){
  if (!buildingsGroup.visible) return;
  for (const cell of buildingCells){
    _cellCenter.set(cell.cx, cell.cy, ELEV_MAX*EXAG*0.5);
    _cellSphere.center.copy(_cellCenter);
    _cellSphere.radius = cell.radius + ELEV_MAX*EXAG*0.5 + 30;
    const dist = camera.position.distanceTo(_cellCenter);
    const visible = (dist - cell.radius) < BLD_RANGE && frustum.intersectsSphere(_cellSphere);
    cell.mesh.visible = visible;
  }
}

function cullForest(){
  // Trees: close-up only, hidden past LOD switch
  if (!treesGroup.visible){
    for (const c of treeCells){ c.mesh.visible = false; }
  } else {
    for (const c of treeCells){
      _cellCenter.set(c.cx, c.cy, ELEV_MAX*EXAG*0.5);
      _cellSphere.center.copy(_cellCenter);
      _cellSphere.radius = c.radius + ELEV_MAX*EXAG*0.5 + c.maxH;
      const dist = camera.position.distanceTo(_cellCenter);
      const near = dist - c.radius;
      const inFrustumNow = frustum.intersectsSphere(_cellSphere);
      c.mesh.visible = inFrustumNow && near < CANOPY_LOD_HI;
    }
  }
  // Canopy: fades in past LOD_LO, out at CANOPY_RANGE
  if (!canopyGroup.visible){
    for (const c of canopyCells){ c.mesh.visible = false; }
    return;
  }
  for (const c of canopyCells){
    const cz = (c.czMin + c.czMax) * 0.5 * EXAG + 4.0;
    _cellCenter.set(c.cx, c.cy, cz);
    _cellSphere.center.copy(_cellCenter);
    _cellSphere.radius = c.radius + (c.czMax - c.czMin) * EXAG * 0.5 + 18.0;
    const dist = camera.position.distanceTo(_cellCenter);
    const near = dist - c.radius;
    const far  = dist + c.radius;
    const inFrustumNow = frustum.intersectsSphere(_cellSphere);
    c.mesh.visible = inFrustumNow && far > CANOPY_LOD_LO && near < CANOPY_RANGE;
  }
}

let drawn = 0;
function visit(z,x,y){
  if (!tileIntersectsSrc(z,x,y)) return;
  const b = tileBoundsWorld(z,x,y);
  if (!inFrustum(b)) return;
  const screenPx = projectedSizePx(b);
  const sse = screenPx / SEG;
  if (z < MAX_Z && sse > SSE_PX) {
    visit(z+1, x*2,   y*2);
    visit(z+1, x*2+1, y*2);
    visit(z+1, x*2,   y*2+1);
    visit(z+1, x*2+1, y*2+1);
    return;
  }
  let tz=z, tx=x, ty=y;
  let t = getTile(tz,tx,ty);
  while ((!t.tex || t.missing) && tz > 0) {
    tz--; tx >>= 1; ty >>= 1;
    t = getTile(tz,tx,ty);
  }
  if (!t.tex) return;
  drawTile(z,x,y, b, tz,tx,ty, t.tex);
}

function drawTile(z,x,y, b, tz,tx,ty, tex){
  const m = acquireMesh();
  m.position.set((b.xmin+b.xmax)/2, (b.ymin+b.ymax)/2, 0);
  m.scale.set(b.size, b.size, 1);
  const u = m.material.uniforms;
  u.uHeight.value = tex;
  u.uOriginXY.value.set(b.xmin, b.ymin);
  u.uTileSize.value = b.size;
  u.uExag.value = EXAG;
  u.uElevMax.value = ELEV_MAX;
  u.uSun.value.copy(SUN);
  u.uSeg.value = SEG;
  u.uFogNear.value = FOG_NEAR;
  u.uFogFar.value = FOG_FAR;
  u.uFogColor.value = FOG_COLOR;
  if (tz === z) {
    u.uUVScale.value.set(1,1);
    u.uUVOffset.value.set(0,0);
  } else {
    const dz = z - tz;
    const span = 1.0 / (1 << dz);
    const ax = x - (tx << dz);
    const ay = y - (ty << dz);
    u.uUVScale.value.set(span, span);
    u.uUVOffset.value.set(ax*span, ay*span);
  }
  drawn++;
}

const COMPASS_SIZE_PX = 140;
const COMPASS_PAD_PX = 16;
const COMPASS_DIST = 3.4;
const _compassFwd = new THREE.Vector3();

function renderCompass() {
  // Mirror main camera orientation around the arrow's origin so visual north matches.
  _compassFwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  compassCam.position.copy(_compassFwd).multiplyScalar(-COMPASS_DIST);
  compassCam.quaternion.copy(camera.quaternion);
  compassCam.updateMatrixWorld();

  const s = COMPASS_SIZE_PX;
  const x = COMPASS_PAD_PX;
  const y = COMPASS_PAD_PX; // GL origin is bottom-left, so this places it at bottom-left
  const prevAutoClear = renderer.autoClear;
  renderer.autoClear = false;
  renderer.setScissorTest(true);
  renderer.setViewport(x, y, s, s);
  renderer.setScissor(x, y, s, s);
  renderer.clearDepth();
  renderer.render(compassScene, compassCam);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.autoClear = prevAutoClear;
}

// ---------- main loop ----------
let last = performance.now(), frames=0;
function loop(){
  requestAnimationFrame(loop);
  controls.update();
  recycleMeshes();
  drawn = 0;

  camera.updateMatrixWorld();
  _projMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(_projMat);

  visit(0,0,0);
  cullBuildings();
  cullForest();
  evictCache();
  renderer.render(scene, camera);
  renderCompass();

  frames++;
  const now = performance.now();
  if (now - last > 500) {
    document.getElementById('fps').textContent = Math.round(frames * 1000 / (now-last));
    frames = 0; last = now;
    document.getElementById('tcount').textContent = drawn;
    document.getElementById('ccount').textContent = tileCache.size;
  }
}

const exagEl = document.getElementById('exag');
exagEl.oninput = () => { EXAG = +exagEl.value; document.getElementById('exagv').textContent = EXAG.toFixed(2); overlayUniforms.uExag.value = EXAG; buildingUniforms.uExag.value = EXAG; treeUniforms.uExag.value = EXAG; canopyUniforms.uExag.value = EXAG; waterUniforms.uExag.value = EXAG; amenityAreaUniforms.uExag.value = EXAG; amenityPropUniforms.uExag.value = EXAG; /* faults z is baked at load time — updating fault EXAG requires geometry rebuild (out of scope) */ };
const sseEl = document.getElementById('sse');
sseEl.oninput = () => { SSE_PX = +sseEl.value; document.getElementById('ssev').textContent = SSE_PX.toFixed(1); };
const segEl = document.getElementById('seg');
segEl.oninput = () => { rebuildPlane(+segEl.value); document.getElementById('segv').textContent = SEG; };
document.getElementById('showRoads').onchange = e => { roadUniforms.uRoadShow.value = e.target.checked ? 1.0 : 0.0; };
document.getElementById('showTowns').onchange = e => { townsGroup.visible = e.target.checked; };
document.getElementById('showBld').onchange = e => { buildingsGroup.visible = e.target.checked; amenitiesGroup.visible = e.target.checked; };
document.getElementById('showTrees').onchange = e => { treesGroup.visible = e.target.checked; canopyGroup.visible = e.target.checked; _updateForestVsGeology(); };
const drapeEl = document.getElementById('drape');
drapeEl.oninput = () => { overlayUniforms.uOffset.value = +drapeEl.value; document.getElementById('drapev').textContent = drapeEl.value; };
const bldRangeEl = document.getElementById('bldRange');
bldRangeEl.oninput = () => {
  BLD_RANGE = (+bldRangeEl.value) * 1000;
  document.getElementById('bldRangev').textContent = bldRangeEl.value;
  buildingUniforms.uFadeFar.value = BLD_RANGE;
  buildingUniforms.uFadeNear.value = Math.max(BLD_RANGE - 4000, BLD_RANGE * 0.7);
  amenityAreaUniforms.uFadeFar.value = BLD_RANGE;
  amenityAreaUniforms.uFadeNear.value = Math.max(BLD_RANGE - 4000, BLD_RANGE * 0.7);
};
const canopyRangeEl = document.getElementById('canopyRange');
canopyRangeEl.oninput = () => {
  CANOPY_RANGE = (+canopyRangeEl.value) * 1000;
  document.getElementById('canopyRangev').textContent = canopyRangeEl.value;
  canopyUniforms.uRangeFar.value  = CANOPY_RANGE;
  canopyUniforms.uRangeNear.value = Math.max(CANOPY_RANGE - 2000, CANOPY_RANGE * 0.85);
};
const canopyLodEl = document.getElementById('canopyLod');
canopyLodEl.oninput = () => {
  const mid = (+canopyLodEl.value) * 1000;
  CANOPY_LOD_LO = Math.max(50, mid - 300);
  CANOPY_LOD_HI = mid + 300;
  document.getElementById('canopyLodv').textContent = canopyLodEl.value;
  // trees fade OUT across the same band; canopy fades IN
  treeUniforms.uFadeNear.value   = CANOPY_LOD_LO;
  treeUniforms.uFadeFar.value    = CANOPY_LOD_HI;
  canopyUniforms.uFadeNear.value = CANOPY_LOD_LO;
  canopyUniforms.uFadeFar.value  = CANOPY_LOD_HI;
};

function _updateForestVsGeology() {
  const geoOn = geoUniforms.uBedShow.value > 0.5 || geoUniforms.uQuatShow.value > 0.5;
  const treesWanted = document.getElementById('showTrees').checked;
  treesGroup.visible  = treesWanted && !geoOn;
  canopyGroup.visible = treesWanted && !geoOn;
}
document.getElementById('cb-bedrock').addEventListener('change', e => {
  geoUniforms.uBedShow.value = e.target.checked ? 1.0 : 0.0;
  _updateForestVsGeology();
});
document.getElementById('cb-quat').addEventListener('change', e => {
  geoUniforms.uQuatShow.value = e.target.checked ? 1.0 : 0.0;
  _updateForestVsGeology();
});
document.getElementById('cb-faults').addEventListener('change', e => {
  faultsGroup.visible = e.target.checked;
});
const blendInput = document.getElementById('r-geo-blend');
const blendVal = document.getElementById('r-geo-blend-val');
blendInput.addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  geoUniforms.uGeoOpacity.value = v;
  blendVal.textContent = v.toFixed(2);
});

// ---- contour controls ----
document.getElementById('cb-contours').addEventListener('change', e => {
  contourUniforms.uContourShow.value = e.target.checked ? 1.0 : 0.0;
});
document.getElementById('contour-interval').addEventListener('change', e => {
  contourUniforms.uContourInterval.value = parseFloat(e.target.value);
});
const contourOpEl = document.getElementById('r-contour-opacity');
const contourOpVal = document.getElementById('r-contour-opacity-val');
contourOpEl.addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  contourUniforms.uContourOpacity.value = v;
  contourOpVal.textContent = v.toFixed(2);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
</body>
</html>
